const canvas = document.getElementById('game');

let dpr=1, cw=0, ch=0;
function resize(){
  dpr = window.devicePixelRatio||1;
  cw = window.innerWidth; ch = window.innerHeight;
  canvas.width = Math.floor(cw*dpr); canvas.height = Math.floor(ch*dpr);
  canvas.style.width = cw+'px'; canvas.style.height = ch+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textBaseline='alphabetic';
}
window.addEventListener('resize', resize);

const SEASON_DAYS = 7;
// 星期系统（仅用于 UI 显示与孩童作息逻辑，不改季节/天数/时间/天气原有机制）
const WEEKDAYS = ['周一','周二','周三','周四','周五','周六','周日'];
function weekdayIndex(){ return ((state.day-1)%7+7)%7; }   // 第1天=周一，7天一循环
function weekdayName(){ return WEEKDAYS[weekdayIndex()]; }

/* ---------------- 天气系统（9 种天气） ---------------- */
const WEATHER_LIST = ['晴','多云','小雨','大雨','雷阵雨','台风','霜冻','小雪','大雪'];
// 灾害天气（固定持续 1 天，且 N肉地图隐藏）：雷阵雨/台风/大雪
const DISASTER_W = {'雷阵雨':1,'台风':1,'大雪':1};
function isDisaster(w){ return !!DISASTER_W[w]; }
function curSeason(){ return SEASONS[Math.floor((state.day-1)/SEASON_DAYS)%4]; }
// 季节天气概率表
function seasonPool(season){
  if(season==='春') return {晴:35,多云:25,小雨:20,大雨:10,雷阵雨:8,霜冻:2};
  if(season==='夏') return {晴:30,多云:20,小雨:15,大雨:15,雷阵雨:12,台风:8};
  if(season==='秋') return {晴:40,多云:30,小雨:20,大雨:10};
  return {晴:25,多云:25,霜冻:20,小雪:20,大雪:10}; // 冬
}
// 抽一天天气：遵守灾害冷却与雷阵雨不连两天
function rollWeatherDay(day, prevW){
  const pool=seasonPool(curSeason());
  let avail=Object.keys(pool);
  if((state.lastTyphoonDay!==undefined) && (day - state.lastTyphoonDay) < 7) avail=avail.filter(k=>k!=='台风');
  if((state.lastSnowDay!==undefined)   && (day - state.lastSnowDay)   < 5) avail=avail.filter(k=>k!=='大雪');
  if(prevW==='雷阵雨') avail=avail.filter(k=>k!=='雷阵雨');
  let sum=avail.reduce((s,k)=>s+pool[k],0);
  if(sum<=0){ avail=['晴']; sum=1; }
  let r=Math.random()*sum;
  for(const k of avail){ r-=pool[k]; if(r<=0) return k; }
  return avail[avail.length-1];
}
function weatherDuration(w){ return isDisaster(w)?1:rndInt(1,3); }
// 应用某天气，并预滚“之后”的天气（供次日预报）
function applyWeather(w, day){
  state.weather=w; state.weatherDays=weatherDuration(w);
  if(w==='台风') state.lastTyphoonDay=day;
  if(w==='大雪') state.lastSnowDay=day;
  const nw=rollWeatherDay(day+1, w);
  state.pendingWeather=nw; state.pendingDays=weatherDuration(nw);
}
// 开局初始化天气
function initWeather(){
  if(state.weatherDays===undefined) state.weatherDays=1;
  if(state.pendingWeather===undefined) state.pendingWeather='晴';
  if(state.lastTyphoonDay===undefined) state.lastTyphoonDay=-99;
  if(state.lastSnowDay===undefined) state.lastSnowDay=-99;
  applyWeather(rollWeatherDay(state.day, null), state.day);
}

/* ---------------- 工具 ---------------- */
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
// 体力消耗（大雪灾害天气消耗大幅上升）
function spend(n){ state.stamina -= n * (state.weather==='大雪'?1.8:1); }
function rnd(a,b){return a+Math.random()*(b-a);}
function rndInt(a,b){return Math.floor(rnd(a,b+1));}
function choice(arr){return arr[Math.floor(Math.random()*arr.length)];}
function dist(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
function key(x,y){return x+','+y;}
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function setFont(size, bold){ ctx.font=(bold?'bold ':'')+size+'px "Microsoft YaHei","PingFang SC",sans-serif'; }
function wrapText(text, maxW){
  const lines=[]; let cur='';
  for(const ch of text){
    const test=cur+ch;
    if(ctx.measureText(test).width>maxW && cur!==''){ lines.push(cur); cur=ch; }
    else cur=test;
  }
  if(cur!=='') lines.push(cur);
  return lines;
}

/* ---------------- 地图生成 ---------------- */
function buildMap(){
  const m = {
    blocked: new Set(),     // "tx,ty" 阻挡
    road: new Set(),        // 路面
    occupied: new Set(),    // 已占用(建筑/树/石/采集/农田/水)
    plaza: new Set(),       // 中央广场瓷砖硬地（占用但不阻挡，不长草/不刷采集物）
    water: new Set(),
    buildings: [],
    trees: [], rocks: [], resources: [], animals: [], npcs: [],
    relics: [],             // 遗迹点位（2孩童 + 2山谷高级残片）
    plots: [],              // 农田
    plotSlots: [],          // 额外农田候选位
  };

  // 四条主路（均1格宽，按用户设计规划图）
  // 上横向主路 y=19（分割北部片区与中部广场），避开右侧河流列 x>=MAP_W-1
  for(let x=0;x<MAP_W-1;x++){ m.road.add(key(x,19)); }
  // 下横向主路 y=31（分割中部广场与南部农村/月湖片区），避开右侧河流列 x>=MAP_W-1
  for(let x=0;x<MAP_W-1;x++){ m.road.add(key(x,31)); }
  // 主纵路 x=20：仅上半部 y=0..31（到下横路为止，不延伸到农村/月湖）
  for(let y=0;y<=31;y++){ m.road.add(key(20,y)); }
  // 副纵路 x=41：仅上半部 y=0..31（到下横路为止，不延伸到农村/月湖）
  for(let y=0;y<=31;y++){ m.road.add(key(41,y)); }
  // 主纵路 x=30：仅下半部 y=31..MAP_H-1（分割农村与月湖片区）
  for(let y=31;y<MAP_H;y++){ m.road.add(key(30,y)); }

  // 水域：右侧主河流 x=MAP_W-1..MAP_W-1 全高（最右一列）；月湖湖面 x=55..MAP_W-2, y=37..MAP_H-1
  for(let y=2;y<MAP_H-1;y++){ m.water.add(key(MAP_W-1,y)); m.occupied.add(key(MAP_W-1,y)); m.blocked.add(key(MAP_W-1,y)); }
  for(let x=55;x<MAP_W-1;x++){ for(let y=37;y<MAP_H-1;y++){ m.water.add(key(x,y)); m.occupied.add(key(x,y)); m.blocked.add(key(x,y)); } }
  // 湖心小岛：在湖中央挖出 7×6 陆地 (x=60..66, y=42..47)，阿溪渔屋位于其上
  for(let x=60;x<=66;x++){ for(let y=42;y<=47;y++){
    const k=key(x,y); m.water.delete(k); m.occupied.delete(k); m.blocked.delete(k);
  }}
  // 通向湖心岛的步行道：从湖左侧岸边 (x=55, y=45) 水平直通小岛左侧 (x=60, y=45)，1格宽，穿越湖水
  for(let x=55;x<=60;x++){
    const k=key(x,45); m.water.delete(k); m.occupied.delete(k); m.blocked.delete(k);
  }

  function addBuilding(b){
    b.label = b.label||'';
    for(let x=b.tx;x<b.tx+b.tw;x++){ for(let y=b.ty;y<b.ty+b.th;y++){
      m.blocked.add(key(x,y)); m.occupied.add(key(x,y));
    }}
    m.buildings.push(b);
  }
  // —— 八大区域建筑（按用户设计规划图 74×51 严格分区，mapName 用于世界地图面板）——
  // 1) 石陶谷（西北：陶坊+石头采集地）
  addBuilding({id:'tao',     tx:11, ty:11, tw:3, th:3, label:'陶叔的陶坊',    mapName:'陶叔陶坊',     roof:'#B5703C', wall:'#EFE2C4'});
  // 2) 匠作坪（北中：木工作坊+林木采集地）
  addBuilding({id:'carpenter',tx:31,ty:13, tw:3, th:3, label:'木伯的工坊',    mapName:'木工作坊',     roof:'#9FA86B', wall:'#EFE2C4'});
  // 3) 木犀猎岭（东北：木犀山+猎屋山林区域）
  addBuilding({id:'yuan',    tx:51, ty:13, tw:3, th:3, label:'阿远的木屋',    mapName:'猎屋',         roof:'#8A9A6B', wall:'#EFE2C4'});
  // 4) 闲居坊（中西：村长家+酒馆）
  addBuilding({id:'cui',     tx:1,  ty:23, tw:3, th:3, label:'翠姐的酒馆',    mapName:'酒馆',         roof:'#C96B8A', wall:'#F3E8CC'});
  addBuilding({id:'granny',  tx:12, ty:24, tw:3, th:3, label:'游村长的家',    mapName:'村长家',       roof:'#C98B6B', wall:'#EFE2C4'});
  // 5) 归耕农场（西南：玩家屋+农田+动物活动范围）
  addBuilding({id:'player',  tx:1,  ty:39, tw:3, th:3, label:'我的家',        mapName:'玩家小屋',     roof:'#C98B6B', wall:'#F1E6C8'});
  // 6) 通衢市井（中东：杂货铺+邮局）
  addBuilding({id:'you',         tx:50, ty:24, tw:3, th:3, label:'许先生的杂货铺', mapName:'许先生的杂货铺', roof:'#D8A24B', wall:'#F3E8CC'});
  addBuilding({id:'xinxin',      tx:59, ty:24, tw:3, th:3, label:'小信的邮局',    mapName:'小信的邮局',     roof:'#C96B9A', wall:'#EFE2C4'});
  // 7) 星湖湾（东南：书塾+知书居所+露营地+阿溪渔屋+月湖水域）
  addBuilding({id:'zhishuHouse', tx:37, ty:40, tw:3, th:3, label:'知书的居所',    mapName:'知书的居所',     roof:'#6B8FC9', wall:'#EFE2C4'});

  addBuilding({id:'bbq',         tx:51, ty:33, tw:3, th:3, label:'露营地',       mapName:'露营地',        roof:'#C98B4B', wall:'#F3E8CC'});
  addBuilding({id:'axi',     tx:62, ty:43, tw:3, th:3, label:'阿溪的渔屋',    mapName:'阿溪渔屋',     roof:'#6BA0C9', wall:'#EFE2C4'});

  // 农田 + 动物围栏：放在野生资源 placeInRects 之后生成（详见末尾），避开野生树石/岩石占位

  // NPC 定义（出生点置于建筑外侧草地；阿乐绑酒馆侧边、小晚绑知书居所侧；玲婆婆与翠姐同住酒馆）
  const npcDefs=[
    {id:'tao',     name:'陶叔',   tx:15, ty:14,  color:'#B5703C', role:'陶匠'},
    {id:'carpenter',name:'木伯',  tx:35, ty:17,  color:'#9FA86B', role:'木匠'},
    {id:'yuan',    name:'阿远',   tx:55, ty:17,  color:'#8A9A6B', role:'猎人'},
    {id:'xinxin',  name:'小信',   tx:63, ty:27,  color:'#C96B9A', role:'邮差'},          // 邮局(59,24) 东侧门口
    {id:'cui',     name:'翠姐',   tx:5,  ty:27,  color:'#C96B8A', role:'酒馆老板娘'},
    {id:'ling',    name:'玲婆婆', tx:5,  ty:26,  color:'#B58BB0', role:'草药婆婆'},
    {id:'granny',  name:'游村长', tx:16, ty:27,  color:'#C98B6B', role:'村长'},
    {id:'you',     name:'许先生', tx:50, ty:28,  color:'#D8A24B', role:'杂货铺老板'},    // 杂货铺(50,24) 南侧外
    {id:'zhishu',  name:'知书',   tx:40, ty:44,  color:'#6B8FC9', role:'私塾少年'},      // 书塾(41,40)与居所(37,40)之间
    {id:'axi',     name:'阿溪',   tx:65, ty:44,  color:'#6BA0C9', role:'钓鱼爱好者'},   // 渔屋(62,43) 在湖心小岛上
    {id:'ale',     name:'阿乐',   tx:4,  ty:26,  color:'#E0A85B', role:'翠姐的儿子', child:true, homeName:'翠姐酒馆旁'},
    {id:'wan',     name:'小晚',   tx:30, ty:45,  color:'#B58BB0', role:'知书的妹妹', child:true, homeName:'知书居所旁'},  // 知书居所(27,43) 旁
  ];
  // 遗迹点位（4 处全部位于木犀山山地范围内）
  m.relics = RELICS.map(r=>({id:r.id, name:r.name, tx:r.tx, ty:r.ty, kind:r.kind}));
  for(const d of npcDefs){
    m.npcs.push({id:d.id, name:d.name, x:d.tx*TILE, y:d.ty*TILE, color:d.color, role:d.role,
      hx:d.tx*TILE, hy:d.ty*TILE, range:0.8, phase:rnd(0,6.28), speed:rnd(0.3,0.6),
      child:!!d.child, homeTx:d.tx, homeTy:d.ty, homeName:d.homeName||''});
  }

  // —— R1 修复（QA P1 缺陷）：预留固定功能瓦片，freeTile 跳过 → 树石永不落入 ——
  // NPC 出生 footprint（2x2 区域，仅占 occupied 不加 blocked，保可行走）
  for(const n of npcDefs){
    const cx=Math.floor(n.tx), cy=Math.floor(n.ty);
    for(let dx=0;dx<2;dx++){ for(let dy=0;dy<2;dy++){
      const tx=cx+dx, ty=cy+dy;
      if(tx>=0&&ty>=0&&tx<MAP_W&&ty<MAP_H){ m.occupied.add(key(tx,ty)); }
    }}
  }
  // 遗迹瓦片
  for(const r of m.relics){ m.occupied.add(key(r.tx, r.ty)); }
  // 孩童作息所有目标点位
  for(const s of CHILD_SCHEDULE){
    if(s.ale){ m.occupied.add(key(s.ale.tx, s.ale.ty)); }
    if(s.wan){ m.occupied.add(key(s.wan.tx, s.wan.ty)); }
  }

  // 占用判定 + 随机布点
  function freeTile(tx,ty){
    if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) return false;
    const k=key(tx,ty);
    return !m.blocked.has(k) && !m.road.has(k) && !m.occupied.has(k);
  }
  function placeInRects(rects, n, arr, block){
    let tries=0;
    while(n>0 && tries<5000){
      tries++;
      const R=choice(rects);
      const tx=rndInt(R.x,R.x+R.w-1), ty=rndInt(R.y,R.y+R.h-1);
      if(!freeTile(tx,ty)) continue;
      m.occupied.add(key(tx,ty));
      if(block) m.blocked.add(key(tx,ty));
      arr.push({tx,ty,depleted:false}); n--;
    }
  }

  // 中央广场：按用户设计规划图 — 主纵 x=20 东侧到副纵 x=41 西侧 (20×11=220 格)
  // 仅占用(map.occupied)不阻挡(map.blocked) → 玩家可自由行走，freeTile 跳过 → 不长草、不刷树石/采集物
  const PLZ = {x:21, y:20, w:20, h:11};
  for(let x=PLZ.x; x<PLZ.x+PLZ.w; x++){ for(let y=PLZ.y; y<PLZ.y+PLZ.h; y++){
    const k=key(x,y); m.plaza.add(k); m.occupied.add(k);
  }}
  m.plazaLabel = {cx: PLZ.x + (PLZ.w>>1), cy: PLZ.y + (PLZ.h>>1)};

  // 各片区 wildRects（按用户设计规划图 74×51 八大区域划分）
  // 石陶谷(NW) | 匠作坪(NC) | 木犀猎岭(NE,不可交互山地) | 闲居坊(MW) | 星湖湾(SE)
  const wildRects=[
    {x:1,  y:2,  w:18, h:16, kind:'stone'},   // 石陶谷：石头采集地
    {x:21, y:2,  w:19, h:16, kind:'wood'},     // 匠作坪：林木采集地
    {x:51, y:2,  w:9,  h:16, kind:'mountain'}, // 木犀猎岭：山地（不可交互，仅装饰）
    {x:1,  y:21, w:18, h:9,  kind:'herb'},     // 闲居坊：草药采集
    {x:31, y:33, w:41, h:17, kind:'gather'},   // 星湖湾：野花野菜蘑菇+月湖
  ];

  // 石陶谷：大量石头 + 少量树木 + 少量采集物
  placeInRects([wildRects[0]], 22, m.rocks, true);
  placeInRects([wildRects[0]], 4,  m.trees, true);
  placeInRects([wildRects[0]], 6,  m.resources, false);
  // 匠作坪：大量树木 + 中量石头 + 少量采集物
  placeInRects([wildRects[1]], 25, m.trees, true);
  placeInRects([wildRects[1]], 12, m.rocks, true);
  placeInRects([wildRects[1]], 6,  m.resources, false);
  // 木犀猎岭（不可交互装饰区）：少量树木+石头，不生成采集物
  placeInRects([wildRects[2]], 8,  m.trees, true);
  placeInRects([wildRects[2]], 5,  m.rocks, true);
  // 闲居坊：少量树石 + 大量草药
  placeInRects([wildRects[3]], 3, m.trees, true);
  placeInRects([wildRects[3]], 3, m.rocks, true);
  placeInRects([wildRects[3]], 16, m.resources, false);
  // 星湖湾（含书塾/知书居所/露营地/阿溪/月湖+小岛）：少量树石 + 大量野花野菜蘑菇
  placeInRects([wildRects[4]], 6, m.trees, true);
  placeInRects([wildRects[4]], 4, m.rocks, true);
  placeInRects([wildRects[4]], 22, m.resources, false);

  // 采集物类型分配（按区域规则）
  let ri=0;
  const resTypes=['berry','fiber','mushroom','flower','herb'];
  // 石陶谷（6）：杂
  for(let i=0;i<6 && ri<m.resources.length;i++,ri++){ m.resources[ri].type=choice(resTypes); }
  // 匠作坪(6)：杂
  for(let i=0;i<6 && ri<m.resources.length;i++,ri++){ m.resources[ri].type=choice(resTypes); }
  // 闲居坊（16）：优先草药
  for(let i=0;i<16 && ri<m.resources.length;i++,ri++){ m.resources[ri].type = (i<10)? 'herb' : choice(resTypes); }
  // 星湖湾（22）：野花+野菜+蘑菇密集
  const gatherTypes=['mushroom','flower','herb','berry'];
  for(let i=0;i<22 && ri<m.resources.length;i++,ri++){ m.resources[ri].type = (i<15)? choice(gatherTypes) : choice(resTypes); }

  // 连片农田（按用户设计规划图：农村位于左下方，主纵 x=30 西侧）
  // 玩家小屋 (1..3, 39..41) 从农田区域中排除；y=42 留空用于通行
  // 区域A = 上段(1..11, 33..38) + 右侧(4..11, 39..41)；区域B (13..29, 33..41)
  const farmRects=[
    {x:1,  y:33, w:11, h:6},   // 区域A上段：玩家小屋上方
    {x:4,  y:39, w:8,  h:3},   // 区域A右侧：玩家小屋右侧
    {x:13, y:33, w:17, h:9},   // 区域B：y=33..41（y=42 留空通行）
  ];
  m.farmRects = farmRects;
  const farmTiles=[];
  for(const R of farmRects){ for(let y=R.y;y<R.y+R.h;y++) for(let x=R.x;x<R.x+R.w;x++){
    // 跳过已被建筑/水域/道路/树石/岩石占据的瓦片（野生资源已生成，确保避开占位）
    if(m.blocked.has(key(x,y)) || m.road.has(key(x,y)) || m.water.has(key(x,y))) continue;
    farmTiles.push({tx:x,ty:y});
  }}
  // 初始10块连片农田（区域A 顶部行 x=1..10, y=33）
  const initPlots=farmTiles.slice(0,10);
  for(const p of initPlots){
    m.plots.push({tx:p.tx, ty:p.ty, stage:'tilled', crop:null, watered:false});
    m.occupied.add(key(p.tx,p.ty));
  }
  // 额外农田候选位（解锁用）：其余农场地块
  m.plotSlots = farmTiles.slice(10);

  // 动物围栏（视觉装饰 + 上方 3 格入口；按设计规划图位于农村下方，主纵 x=30 西侧）
  // 范围 (1..29, 43..50)，左=地图左缘、右=主纵路 x=30-1
  m.fence = new Set();
  m.fenceRects = [{x:1,y:43,w:29,h:8}];
  for(let y=44;y<=50;y++){ m.fence.add(key(1,y)); m.fence.add(key(29,y)); }   // 左/右两侧
  for(let x=2;x<=28;x++) m.fence.add(key(x,50));                               // 下侧
  for(let x=2;x<=6;x++) m.fence.add(key(x,43));                                // 上侧左段
  for(let x=10;x<=28;x++) m.fence.add(key(x,43));                              // 上侧右段
  // x=7..9, y=43 留 3 格上方入口

  // 畜牧区/动物活动范围：紧贴农田下方 (1..28, 43..50)
  const liveRect={x:1,y:43,w:28,h:8};
  const animalDefs=[
    {kind:'cow',  product:'milk',  color:'#F2E8D8', hide:'pelt'},
    {kind:'sheep',product:'wool',  color:'#F0EAD8', hide:'pelt'},
    {kind:'chicken',product:'egg', color:'#F6E7B0'},
    {kind:'duck', product:'egg',   color:'#E8D8A0'},
  ];
  let at=0;
  for(let i=0;i<animalDefs.length;i++){
    let placed=false, t=0;
    while(!placed && t<400){
      t++;
      const tx=rndInt(liveRect.x,liveRect.x+liveRect.w-1);
      const ty=rndInt(liveRect.y,liveRect.y+liveRect.h-1);
      if(!freeTile(tx,ty)) continue;
      // 不与其它动物太近
      let ok=true;
      for(const a of m.animals){ if(dist(a.tx,a.ty,tx,ty)<2.2){ok=false;break;} }
      if(!ok) continue;
      m.occupied.add(key(tx,ty));
      const a=animalDefs[i];
      m.animals.push({tx,ty, hx:tx, hy:ty, kind:a.kind, product:a.product, color:a.color,
        range:rnd(0.5,1.0), phase:rnd(0,6.28), speed:rnd(0.5,1.0)});
      placed=true;
    }
  }

  return m;
}

function allSecretsComplete(){

function storyUnlocked(id){
  const g=state.goodwill[id]||0;
  const qs=state.quests[id];
  const d0=qs&&qs.chainDone&&qs.chainDone[0];

  return { shallow:g>=FAVOR_RANGES[2][0], mid:g>=FAVOR_RANGES[4][0]&&!!d0, ultimate:g>=FAVOR_RANGES[6][0]&&!!d2 };
}

/* ---------------- 好感档位（0~999，7档统一区间，全部NPC共用，含阿乐/小晚） ---------------- */
// 区间：陌生0-99｜熟识100-249｜友好250-449｜亲近450-649｜投缘650-799｜知己800-899｜至交900-999
const FAVOR_TIERS = ['陌生','熟识','友好','亲近','投缘','知己','至交'];
const FAVOR_RANGES = [[0,99],[100,249],[250,449],[450,649],[650,799],[800,899],[900,999]];
const FAVOR_MAX = 999;
function favorInfo(v){
  v = clamp(v,0,FAVOR_MAX);
  let idx=0;
  for(let i=0;i<FAVOR_RANGES.length;i++){ if(v>=FAVOR_RANGES[i][0]) idx=i; }
  const lo=FAVOR_RANGES[idx][0], hi=FAVOR_RANGES[idx][1];
  // value=当前总好感值；max=本等级上限(hi)；prog/span=本等级内进度（用于进度条）
  return {idx, tier:FAVOR_TIERS[idx], value:v, lo, hi, max:hi, prog:v-lo, span:hi-lo};
}
function favorMin(tierIdx){ return FAVOR_RANGES[tierIdx][0]; } // 该档位解锁所需的最低好感
function goodwillTier(v){ return favorInfo(v).tier; }
// 增加好感：至交(900+)上限默认999；但在完成该NPC“铺垫任务”(三段全完成)之前，锁定在知己上限899
// （硬性：完成铺垫任务，才开放至交999好感上限）。孩童NPC无任务链，上限恒为999。
function favorCap(id){ return (NPC_CHAINS[id] && !allChainDone(id)) ? FAVOR_RANGES[5][1] : FAVOR_MAX; } // 知己上限899 / 999
function addFavor(id, n){
  const cap = favorCap(id);
  state.goodwill[id] = clamp((state.goodwill[id]||0)+n, 0, cap);
}
// 天气/时间/场景判定
function isRain(){ const w=state.weather; return w==='小雨'||w==='大雨'||w==='雷阵雨'; }
function isNight(){ return state.time<6 || state.time>=20; } // 夜晚
function nearMapEdge(){ const tx=Math.floor(state.px/TILE), ty=Math.floor(state.py/TILE); return tx<=1||ty<=1||tx>=MAP_W-2||ty>=MAP_H-2; }
function sceneReady(st){
  if(!st||!st.scene) return true;
  if(st.scene==='rain_night') return isRain() && isNight();
  if(st.scene==='edge') return nearMapEdge();
  return false; // deliver / interview 由交谈推进
}
function npcName(id){ const n=map.npcs.find(x=>x.id===id); return n?n.name:id; }
// 发放额外农田（任务奖励用）
function grantPlots(n){
  for(let i=0;i<n;i++){
    if(state.unlockedPlotCount<map.plotSlots.length){
      const s=map.plotSlots[state.unlockedPlotCount++];
      map.plots.push({tx:s.tx,ty:s.ty,stage:'wild',crop:null,watered:false});
      map.occupied.add(key(s.tx,s.ty));
    }
  }
}
// 机会掉落（世界采集/伐木/凿石/钓鱼时偶发）：返回掉落物品 id 或 null，由调用处拼装提示
function chanceDrop(item, prob){ if(Math.random()<prob){ addItem(item,1); return item; } return null; }
// 交谈推进“送达/打听”类任务：与对应NPC对话即可标记进度，全部完成自动交任务
// 返回值：若因此完成了某任务（已接管弹窗）则 true，调用方应中止自身弹窗构建
function handleChainDelivery(talkId){
  for(const id in NPC_CHAINS){
    const ch=NPC_CHAINS[id]; const qs=state.quests[id];
    if(!qs || qs.accepted<0 || qs.chainDone[qs.accepted]) continue;
    const st=ch[qs.accepted];
    if((st.scene==='deliver'||st.scene==='interview') && st.targets && st.targets.indexOf(talkId)>=0){
      const kn = st.scene==='deliver' ? 'deliver' : 'interview';
      if(!qs[kn]){ qs[kn]={}; for(const t of st.targets) qs[kn][t]=false; }
      if(!qs[kn][talkId]){
        qs[kn][talkId]=true; save();
        const n=Object.values(qs[kn]).filter(Boolean).length;
        toast((st.scene==='deliver'?'已将信件交给 ':'已向 ')+npcName(talkId)+(st.scene==='deliver'?'（'+n+'/'+st.targets.length+'）':' 打听传闻（'+n+'/'+st.targets.length+'）'));
        if(n>=st.targets.length){ submitChainQuest(id, qs.accepted); return true; }
      }
    }
  }
  return false;
}
// 场景任务自动完成（在游戏循环/打开NPC时调用）
function checkSceneQuests(){
  for(const id in NPC_CHAINS){
    const ch=NPC_CHAINS[id]; const qs=state.quests[id];
    if(!qs || qs.accepted<0 || qs.chainDone[qs.accepted]) continue;
    const st=ch[qs.accepted];
    if(st.scene==='edge' && nearMapEdge()){ submitChainQuest(id, qs.accepted); return; }
  }
}

  try{
    const d={
      px:state.px, py:state.py, dir:state.dir, stamina:state.stamina, maxStamina:state.maxStamina,
      day:state.day, time:state.time, weather:state.weather, weatherDays:state.weatherDays, pendingWeather:state.pendingWeather, pendingDays:state.pendingDays, lastTyphoonDay:state.lastTyphoonDay, lastSnowDay:state.lastSnowDay, coin:state.coin, houseLevel:state.houseLevel,
      unlockedPlotCount:state.unlockedPlotCount, inv:state.inv, goodwill:state.goodwill,

function load(){
  try{
    // URL 参数 ?reset=1（或 &reset=1）：强制清档开新局（处理坏档/卡死/想重开）
    if(typeof location!=='undefined' && /[?&]reset=1/.test(location.search||'')){
      try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    }
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d=JSON.parse(raw);
    state = defaultState();
    Object.assign(state, d);
    // 自愈：玩家坐标非法/出画布（旧档损坏或曾卡出地图）→ 强制拉回小屋出生点
    const HOME_X=2*TILE, HOME_Y=38*TILE;
    if(!isFinite(state.px)||!isFinite(state.py)||state.px<0||state.py<0||state.px>=MAP_W*TILE||state.py>=MAP_H*TILE){
      state.px=HOME_X; state.py=HOME_Y;
    }
    if(!state.inv) state.inv={};
    if(!state.goodwill) state.goodwill={granny:0,carpenter:0,axi:0,xinxin:0,you:0};
    for(const id of ['granny','carpenter','axi','xinxin','you','ling','yuan','zhishu','cui','tao','ale','wan']) if(state.goodwill[id]===undefined) state.goodwill[id]=0;
    // 旧存档好感兼容：新等级表仍基于 0~999 同尺度，数值本身无需改写；
    // 仅按“当前上限”收敛到新体系合法区间（未完成任务则锁定至 知己上限799，
    // 已完成任务/无任务链的孩童则保持 999），既映射到新等级体系，又不抹掉玩家已有进度。
    for(const id of Object.keys(state.goodwill)){
      let v = clamp(state.goodwill[id]||0, 0, FAVOR_MAX);
      state.goodwill[id] = Math.min(v, favorCap(id));
    }
    if(!state.helpers) state.helpers={ale:{active:false,t:0,cd:0,gatherCd:0},wan:{active:false,t:0,cd:0,gatherCd:0}};
    if(!state.helpers.ale) state.helpers.ale={active:false,t:0,cd:0,gatherCd:0};
    if(!state.helpers.wan) state.helpers.wan={active:false,t:0,cd:0,gatherCd:0};
    if(!state.quests) state.quests={};
    if(!state.codex) state.codex={};
    if(!state.invOrder) state.invOrder=[];
    if(state.gotAncientSeed===undefined) state.gotAncientSeed=false;
    if(!state.endingClaimed) state.endingClaimed={};
    if(state.carpenterDiscount===undefined) state.carpenterDiscount=false;
    if(state.mainStoryUnlocked===undefined) state.mainStoryUnlocked=false;
    if(state.invExpanded===undefined) state.invExpanded=false;
    if(state.weatherDays===undefined) state.weatherDays=1;
    if(state.pendingWeather===undefined) state.pendingWeather='晴';
    if(state.pendingDays===undefined) state.pendingDays=1;
    if(state.lastTyphoonDay===undefined) state.lastTyphoonDay=-99;
    if(state.lastSnowDay===undefined) state.lastSnowDay=-99;
    if(!state.randomQuests) state.randomQuests={};
    if(!state.randomGifts) state.randomGifts={};
    map = buildMap();
    // 重建农田
    map.plots = d.plots.map(p=>({tx:p.tx,ty:p.ty,stage:p.stage,crop:p.crop,watered:p.watered}));
    // 额外农田占用（解锁过的不应再被随机占用——已通过 plotSlots 未被占用，安全）
    for(const p of map.plots) map.occupied.add(key(p.tx,p.ty));
    return true;
  }catch(e){ return false; }
}

// 导出/导入存档（仅浏览器中点击触发，无头测试不调用，不影响逻辑）
function exportSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY)||'{}';
    const blob=new Blob([raw], {type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='pixel_island_save.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    toast('存档已导出为 JSON 文件');
  }catch(e){ toast('导出失败：'+e.message); }
}
function importSave(){
  try{
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='application/json,.json'; inp.style.display='none';
    inp.onchange=()=>{
      const f=inp.files&&inp.files[0]; if(!f) return;
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const d=JSON.parse(String(reader.result));
          if(typeof d!=='object' || d===null) throw new Error('格式错误');
          localStorage.setItem(SAVE_KEY, JSON.stringify(d));
          if(!load()) state=defaultState();
          buildMenuButtons(); buildBottomButtons();
          toast('存档导入成功，已载入');
        }catch(err){ toast('导入失败：'+err.message); }
      };
      reader.readAsText(f);
    };
    document.body.appendChild(inp); inp.click(); document.body.removeChild(inp);
  }catch(e){ toast('导入失败：'+e.message); }
}

/* ---------------- 背包 ---------------- */
function addItem(id, n){
  n=n||1;
  state.inv[id]=(state.inv[id]||0)+n;
  if(!state.invOrder) state.invOrder=[];
  if(state.invOrder.indexOf(id)<0) state.invOrder.push(id);
  state.codex[id]=true;
}
// 按显示顺序返回背包物品 id（过滤掉数量为0与金币占位）
function invIds(){
  const order = state.invOrder || [];
  const present = order.filter(k=> (state.inv[k]||0)>0 && k!=='coin');
  const extra = Object.keys(state.inv).filter(k=> (state.inv[k]||0)>0 && k!=='coin' && present.indexOf(k)<0);
  return present.concat(extra);
}
// 展开背包时点物品置顶：移动到显示顺序最前，便于调整收起时顶部5格
function reorderInv(id){
  if(!state.invOrder) state.invOrder=[];
  const i=state.invOrder.indexOf(id);
  if(i>=0) state.invOrder.splice(i,1);
  state.invOrder.unshift(id);
  save(); toast('已置顶：'+(ITEMS[id]?ITEMS[id].name:id));
}
function hasItems(req){
  for(const k in req){ if((state.inv[k]||0) < req[k]) return false; }
  return true;
}
function takeItems(req){
  for(const k in req){ state.inv[k]-=req[k]; if(state.inv[k]<=0) delete state.inv[k]; }
}

/* ---------------- 碰撞 ---------------- */
function collides(px,py){
  const half=14;
  const minx=Math.floor((px-half)/TILE), maxx=Math.floor((px+half)/TILE);
  const miny=Math.floor((py-half)/TILE), maxy=Math.floor((py+half)/TILE);
  // 地图边界外视为阻挡：玩家/NPC 碰撞盒不允许超出画布 [0, MAP_W)×[0, MAP_H)
  if(minx<0 || maxx>=MAP_W || miny<0 || maxy>=MAP_H) return true;
  for(let tx=minx;tx<=maxx;tx++){
    for(let ty=miny;ty<=maxy;ty++){
      if(map.blocked.has(key(tx,ty))) return true;
    }
  }
  return false;
}

// 统一指针按下处理（鼠标与触摸共用，原有全部交互逻辑保持不变）
function onPointerDown(mx,my){
  mouseX=mx; mouseY=my;
  if(currentPopup){ handlePopupClick(mx,my); return; }
  // 功能按钮组（地图/任务/图鉴/名册/帮助）

    if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){ b.action(); return; }
  }
  // 底部按钮
  for(const b of bottomButtons){
    if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){ b.action(); return; }
  }
  // 展开背包时点物品：可食用物品右下角"食"按钮→食用恢复体力；其余点击→置顶排序（调整收起时顶部5格）
  if(state.invExpanded){
    for(const s of invSlotsRender){
      if(s.eat && mx>=s.eat.x&&mx<=s.eat.x+s.eat.w&&my>=s.eat.y&&my<=s.eat.y+s.eat.h){ doEat(s.id); return; }
    }
    for(const s of invSlotsRender){
      if(mx>=s.x&&mx<=s.x+s.w&&my>=s.y&&my<=s.y+s.h){ reorderInv(s.id); return; }
    }
  }
  // 点击 NPC（灾害/小雪居家时不响应）
  for(const npc of map.npcs){
    if(npcHidden(npc)) continue;
    const sx=npc.x-cam.x, sy=npc.y-cam.y;

// 移动端触摸映射：触摸屏幕坐标 → 画布坐标（与鼠标完全一致），弹窗内可拖拽滚动
let _tAct=false, _tMoved=false, _tLY=0, _tsx=0, _tsy=0;
function _tPt(t){ const r=canvas.getBoundingClientRect(); return {x:t.clientX-r.left, y:t.clientY-r.top}; }
canvas.addEventListener('touchstart', e=>{
  if(e.touches.length!==1) return;
  const p=_tPt(e.touches[0]); _tsx=p.x; _tsy=p.y; _tLY=p.y; _tMoved=false; _tAct=true;
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchmove', e=>{
  if(!_tAct || e.touches.length!==1) return;
  const p=_tPt(e.touches[0]);
  if(currentPopup){
    if(Math.abs(p.y-_tsy)>6) _tMoved=true;
    const dy=p.y-_tLY; _tLY=p.y;
    const pp=currentPopup, clipH=pp.ph-pp.titleH-pp.tabsH-36;
    pp.scrollY=clamp(pp.scrollY-dy, 0, Math.max(0, pp._cy-clipH));
  } else if(Math.abs(p.x-_tsx)>8 || Math.abs(p.y-_tsy)>8) _tMoved=true;
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchend', e=>{
  if(!_tAct) return; _tAct=false;
  const t=(e.changedTouches&&e.changedTouches[0]); if(!t) return;
  const p=_tPt(t);
  if(currentPopup){ if(!_tMoved) handlePopupClick(p.x,p.y); }
  else if(!_tMoved) onPointerDown(p.x,p.y);
  e.preventDefault();
}, {passive:false});

canvas.addEventListener('wheel', e=>{
  if(currentPopup){
    e.preventDefault();
    const p=currentPopup;
    const clipH = p.ph - p.titleH - p.tabsH - 36;
    const contentH = p._cy;
    const max = Math.max(0, contentH - clipH);
    p.scrollY = clamp(p.scrollY + (e.deltaY>0?28:-28), 0, max);
  }
},{passive:false});

/* ---------------- Toast ---------------- */
let toastMsg='', toastT=0;
let hoverInv=null;
function toast(m){ toastMsg=m; toastT=2.2; }

/* ---------------- 交互NPC ---------------- */
function nearestNPC(){
  let best=null, bd=1e9;
  for(const npc of map.npcs){
    const d=dist(state.px,state.py,npc.x,npc.y);
    if(d<bd){bd=d;best=npc;}
  }
  return (best&&bd< TILE*1.8)?best:null;
}
function tryInteractNPC(){
  if(currentPopup) return;
  const n=nearestNPC();
  if(n) openNPC(n.id);
}

/* ================= 玩法动作 ================= */
function nearPlot(){
  let best=null,bd=1e9;
  for(const p of map.plots){
    const cx=(p.tx+0.5)*TILE, cy=(p.ty+0.5)*TILE;
    const d=dist(state.px,state.py,cx,cy);
    if(d<bd){bd=d;best=p;}
  }
  return (best&&bd< TILE*1.7)?best:null;
}
function nearType(arr, range){
  let best=null,bd=1e9;
  for(const o of arr){
    const cx=(o.tx+0.5)*TILE, cy=(o.ty+0.5)*TILE;
    const d=dist(state.px,state.py,cx,cy);
    if(d<bd){bd=d;best=o;}
  }
  return (best&&bd<range)?best:null;
}
function nearWater(){
  let best=null,bd=1e9;
  for(let x=0;x<MAP_W;x++){for(let y=0;y<MAP_H;y++){
    if(map.water.has(key(x,y))){
      const cx=(x+0.5)*TILE, cy=(y+0.5)*TILE;
      const d=dist(state.px,state.py,cx,cy);
      if(d<bd){bd=d;best={x,y};}
    }
  }}
  return (best&&bd<TILE*1.8)?best:null;
}
function nearAnimal(){
  let best=null,bd=1e9;
  for(const a of map.animals){
    const cx=(a.tx+0.5)*TILE, cy=(a.ty+0.5)*TILE;
    const d=dist(state.px,state.py,cx,cy);
    if(d<bd){bd=d;best=a;}
  }
  return (best&&bd<TILE*1.8)?best:null;
}
function nearPlayerHouse(){
  const hx=2*TILE, hy=40*TILE;   // 玩家房屋中心（tx=1..3, ty=39..41）
  return dist(state.px,state.py,hx,hy) < TILE*2.4;
}

function doPlant(){
  if(state.stamina<5){ toast('体力不足'); return; }
  const p=nearPlot();
  if(!p){ toast('附近没有可耕种的农田'); return; }
  if(p.stage==='wild'){
    p.stage='tilled'; spend(5); toast('开垦了一块农田'); save(); return;
  }
  if(p.stage==='tilled'){
    // 选种子
    const seeds=Object.keys(SEED_TO_CROP).filter(s=>(state.inv[s]||0)>0);
    if(seeds.length===0){ toast('没有种子，去找许先生买吧'); return; }
    openSeedChooser(p, seeds);
    return;
  }
  if(p.stage==='seeded'||p.stage==='growing'){
    // 浇水（种植按钮集成浇水，需求未设独立浇水按钮）
    if(p.watered){ toast('已经浇过水啦，睡觉可催熟'); return; }
    p.watered=true; if(p.stage==='seeded') p.stage='growing';
    spend(3); toast('浇水完成'); save(); return;
  }
  if(p.stage==='mature'){
    const cropName = ITEMS[p.crop].name;
    addItem(p.crop,1);
    p.stage='tilled'; p.crop=null; p.watered=false;
    spend(5); toast('收获 '+cropName+' 成功');
    save(); return;
  }
}
function openSeedChooser(plot, seeds){

  addText(p,'点击种子播种到附近农田',0,cw0,COL.sub,13); addGap(p,6);
  for(const s of seeds){
    addText(p, ITEMS[s].name+' x'+(state.inv[s]||0), 0, cw0-90, COL.text, 14);
    addButton(p,'播种', cw0-82, 82, 30, ()=>{ plantWith(plot, s); closePopup(); });
    addGap(p,4);
  }

}
function plantWith(p, seed){

  state.inv[seed]--; if(state.inv[seed]<=0) delete state.inv[seed];

}
function doCollect(){

function doFish(){

function doAnimal(){

function doEat(id){
  if(!id || !(id in EDIBLE)){ return; }
  if((state.inv[id]||0)<=0){ toast('没有'+ITEMS[id].name); return; }
  if(state.stamina>=state.maxStamina){ toast('体力已满，吃不下了'); return; }
  state.inv[id]--; if(state.inv[id]<=0) delete state.inv[id];
  state.stamina=Math.min(state.maxStamina, state.stamina+EDIBLE[id]);
  toast('食用'+ITEMS[id].name+'，恢复'+EDIBLE[id]+'体力'); save();
}
function doSleep(){
  if(!nearPlayerHouse()){ toast('要回到自己的小屋才能睡觉'); return; }
  startSleep();
}
function startSleep(){
  state.sleeping=true; state.sleepTimer=1.6;
}
function finishSleep(){
  state.sleeping=false;
  state.day+=1;
  state.time=8;
  state.stamina=state.maxStamina;
  // 天气推进：仅睡觉切换；普通天气持续1-3天，灾害固定1天
  state.weatherDays = (state.weatherDays||1) - 1;
  if(state.weatherDays>0){
    // 当前天气延续
  } else {
    applyWeather(state.pendingWeather, state.day);
  }
  const W = state.weather;
  const storm = (W==='雷阵雨');
  const lightSnow = (W==='小雪');
  const heavySnow = (W==='大雪');
  // 作物生长 + 天气影响
  for(const p of map.plots){
    if(storm) p.watered=true;                 // 雷阵雨：全田自动浇水
    if(p.watered){
      if(p.stage==='seeded'){
        if(storm){                             // 新种子高概率冲毁
          if(Math.random()<0.7){ p.stage='tilled'; p.crop=null; }
          else p.stage='growing';
        } else if(lightSnow){                  // 小雪：仅耐寒作物正常生长
          if(COLD_RESIST[p.crop]) p.stage='growing';
        } else if(heavySnow){                  // 大雪：非冬作物大概率枯死；冬作物减速
          if(!COLD_RESIST[p.crop]){ if(Math.random()<0.7){ p.stage='tilled'; p.crop=null; } }
          else if(Math.random()<0.5) p.stage='growing';
        } else { p.stage='growing'; }
      } else if(p.stage==='growing'){
        if(heavySnow && !COLD_RESIST[p.crop]){ // 非冬作物大雪枯死
          if(Math.random()<0.7){ p.stage='tilled'; p.crop=null; } else p.stage='mature';
        } else if(lightSnow){
          if(COLD_RESIST[p.crop]) p.stage='mature'; // 仅耐寒成熟
        } else if(heavySnow){
          if(COLD_RESIST[p.crop] && Math.random()<0.5) p.stage='mature';
        } else { p.stage='mature'; }
      }
      p.watered=false;
    }
    // 成熟作物小概率雷击损毁（雷阵雨）
    if(storm && p.stage==='mature' && Math.random()<0.15){ p.stage='tilled'; p.crop=null; p.watered=false; }
  }
  // 采集物/动物/树木/石头重置 + 天气影响采集物
  for(const r of map.resources){
    if(heavySnow){ r.depleted=true; }                       // 大雪：无野外采集物
    else if(lightSnow){ r.depleted=false; r.type=choice(WINTER_RES); } // 小雪：只刷新冬日专属
    else if(storm){ r.depleted = Math.random()<0.5; }       // 雷阵雨：部分被冲刷消失
    else { r.depleted=false; }
  }
  for(const a of map.animals) a.depleted=false;
  for(const t of map.trees) t.depleted=false;
  for(const r of map.rocks) r.depleted=false;
  toast('新的一天 · '+SEASONS[Math.floor((state.day-1)/SEASON_DAYS)%4]+'季 第'+(((state.day-1)%SEASON_DAYS)+1)+'天');
  save();
}

function npcQuote(id){
  const w=state.weather;
  const q=NPC_QUOTES[id];
  if(q){
    if(isDisaster(w) && q.灾) return choice(q.灾);
    if((w==='小雪'||w==='大雪') && q.雪) return choice(q.雪);
    if((w==='小雨'||w==='大雨') && q.雨) return choice(q.雨);
    if((w==='晴'||w==='多云') && q.晴) return choice(q.晴);

function submitQuest(npcId, qid){
  const q=QUESTS[qid];
  if(!hasItems(q.req)){ toast('物品不足，无法提交'); return; }
  takeItems(q.req);
  const r=q.reward;
  if(r.coins) state.coin+=r.coins;
  if(r.unlockPlots){
    for(let i=0;i<r.unlockPlots;i++){ if(state.unlockedPlotCount<map.plotSlots.length){ const s=map.plotSlots[state.unlockedPlotCount++]; map.plots.push({tx:s.tx,ty:s.ty,stage:'wild',crop:null,watered:false}); map.occupied.add(key(s.tx,s.ty)); } }
  }
  if(r.items){ for(const k in r.items) addItem(k, r.items[k]); }
  state.quests[qid]={accepted:true,completed:true};
  save();
  toast('任务完成！奖励已发放');
  openNPC(npcId);
}
// 任务链：顺序解锁，好感达档位方可接取；completed 存入 state.quests[id].chainDone
// 约束：已接取的任务不受好感降级影响（始终可提交）；未接取才受档位门槛限制
function renderChainQuests(id, chain, p, cw0){
  let qs=state.quests[id];
  if(!qs || !qs.chainDone){ qs={chainDone:chain.map(()=>false),accepted:-1}; state.quests[id]=qs; }
  const g=state.goodwill[id]||0;
  for(let i=0;i<chain.length;i++){
    const st=chain[i];
    if(qs.chainDone[i]){ addText(p,'✓ '+st.name+'（已完成）', 0, cw0, COL.accent2, 13); addGap(p,4); continue; }
    // 已接取：不受降级影响，始终展示提交
    if(qs.accepted===i){
      const ok = st.scene ? sceneReady(st) : hasItems(st.req||{});
      addText(p,'任务【'+st.name+'】'+st.desc, 0, cw0, COL.text, 13);
      if(st.scene==='deliver'){
        const n = qs.deliver? Object.values(qs.deliver).filter(Boolean).length:0;
        addText(p,'进展：已递交 '+n+'/'+st.targets.length+' 封信', 0, cw0, COL.sub, 12);
      } else if(st.scene==='interview'){
        const n = qs.interview? Object.values(qs.interview).filter(Boolean).length:0;
        addText(p,'进展：已打听 '+n+'/'+st.targets.length+' 位', 0, cw0, COL.sub, 12);
      } else if(st.scene==='rain_night'){
        addText(p, ok?'✓ 雨夜已至，可完成':'✗ 需在雨天夜晚找阿溪', 0, cw0, ok?COL.accent2:COL.accent, 13);
      } else if(st.scene==='edge'){
        addText(p, ok?'✓ 已抵达村外边缘':'✗ 需前往地图村外边缘', 0, cw0, ok?COL.accent2:COL.accent, 13);
      } else {
        addText(p, ok?'✓ 背包物品已满足':'✗ 物品不足', 0, cw0, ok?COL.accent2:COL.accent, 13);
      }
      if(st.scene==='deliver'||st.scene==='interview'){
        addText(p,'（与对应NPC交谈以推进）',0,cw0,COL.sub,12);
      } else {
        addButton(p,'提交任务', 0, cw0, 34, ()=>{ submitChainQuest(id,i); }, ok);
      }
      addGap(p,4); break;
    }
    // 顺序解锁：前一段必须完成
    if(i>0 && !qs.chainDone[i-1]){ addText(p,'🔒 '+st.name+'（需先完成上一段）',0,cw0,COL.faint,13); addGap(p,4); break; }
    // 好感档位门槛（仅限制接取）
    if(g < favorMin(st.tierReq)){
      addText(p,'🔒 '+st.name+'（好感达'+FAVOR_TIERS[st.tierReq]+'解锁）', 0, cw0, COL.faint, 13); addGap(p,4); break;
    }
    addButton(p,'接取任务：'+st.name, 0, cw0, 34, ()=>{
      qs.accepted=i;
      if(st.scene==='deliver'){ qs.deliver={}; for(const t of (st.targets||[])) qs.deliver[t]=false; }
      if(st.scene==='interview'){ qs.interview={}; for(const t of (st.targets||[])) qs.interview[t]=false; }
      save(); openNPC(id);
    });
    addGap(p,4); break;
  }
}
function submitChainQuest(id, i){
  const st=NPC_CHAINS[id][i];
  let qs=state.quests[id];
  if(!qs || !qs.chainDone){ qs={chainDone:NPC_CHAINS[id].map(()=>false),accepted:-1}; state.quests[id]=qs; }
  if(qs.chainDone[i]) return;
  if(!hasItems(st.req||{})){ toast('物品不足，无法提交'); return; }
  takeItems(st.req||{});
  const r=st.reward||{};
  qs.chainDone[i]=true; qs.accepted=-1;   // 先解锁后发奖：铺垫任务完成后至交上限(999)才开放
  if(r.coins) state.coin+=r.coins;
  if(r.items){ for(const k in r.items) addItem(k, r.items[k]); }
  if(r.favor) addFavor(id, r.favor);
  if(r.plots) grantPlots(r.plots);
  if(r.discount) state.carpenterDiscount=true;
  save();
  // 终段完成 → 一次性至交专属馈赠（仅文档5位NPC）
  const isLast = (i===NPC_CHAINS[id].length-1);
  if(isLast && NPC_SECRET[id] && NPC_SECRET[id].reward && !state.endingClaimed[id]){
    const e=NPC_SECRET[id].reward;
    if(e.coins) state.coin+=e.coins;
    if(e.items){ for(const k in e.items) addItem(k, e.items[k]); }
    state.endingClaimed[id]=true;
    toast(npcName(id)+' 向你赠予了专属馈赠');
  } else {
    toast('任务完成！奖励已发放');
  }
  openNPC(id);
}

/* ============ 随机委托任务系统（逻辑） ============ */
function randomQuestState(id){ if(!state.randomQuests[id]) state.randomQuests[id]={active:null,done:{}}; return state.randomQuests[id]; }
// 可接取的委托：无进行中 + 好感达标 + 未完成 → 随机挑一个（任务完成即从池剔除，不再刷出）
function randomQuestAvailable(id){
  const rq=randomQuestState(id);
  if(rq.active) return null;
  const g=state.goodwill[id]||0, idx=favorInfo(g).idx;
  const pool=(RANDOM_QUESTS[id]||[]).filter(t=>!rq.done[t.id] && idx>=t.minTier);
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}
function acceptRandomQuest(id){
  const rq=randomQuestState(id);
  if(rq.active){ toast('已有进行中的委托，先完成它吧'); return; }
  const t=randomQuestAvailable(id);
  if(!t){ toast('暂时没有可接取的委托'); return; }
  rq.active=t.id; save(); toast('已接取委托：'+t.name);
}
function submitRandomQuest(id){
  const rq=randomQuestState(id);
  if(!rq.active){ toast('没有进行中的委托'); return; }
  const t=(RANDOM_QUESTS[id]||[]).find(x=>x.id===rq.active);
  if(!t){ rq.active=null; save(); return; }
  if(!hasItems(t.req)){ toast('物品不足，无法提交'); return; }
  takeItems(t.req);
  if(t.reward.coins) state.coin+=t.reward.coins;
  if(t.reward.items){ for(const k in t.reward.items) addItem(k, t.reward.items[k]); }
  rq.done[t.id]=true; rq.active=null; save();
  toast('委托完成！奖励已发放');
}
// NPC 交谈界面渲染随机委托区块
function renderRandomQuest(id, p, cw0){
  const pool=RANDOM_QUESTS[id]||[];
  if(!pool.length) return;
  const rq=randomQuestState(id);
  addDivider(p, cw0); addGap(p,4);
  addText(p,'【委托】', 0, cw0, COL.accent, 14);

      addText(p, t.name+'：'+t.desc, 0, cw0, COL.text, 13);
      const ok=hasItems(t.req);
      addText(p, ok?'✓ 背包物品已满足':'✗ 物品不足', 0, cw0, ok?COL.accent2:COL.accent, 13);
      addButton(p,'提交委托', 0, cw0, 32, ()=>{ submitRandomQuest(id); openNPC(id); }, ok);
    }
  } else {

// 好感解锁的商店购买项（追加到基础 buy 列表）
function shopBuyList(id){
  const base=(NPC_SHOP[id]&&NPC_SHOP[id].buy)||[];
  const g=state.goodwill[id]||0, idx=favorInfo(g).idx;
  const list=base.slice();
  const push=(item,price,name)=>{ if(!list.some(x=>x.item===item)) list.push({item,price,name}); };
  if(id==='you'){          // 许先生杂货商店：好感解锁高级种子
    if(idx>=3) push('rare_seed', 120, '稀有种子');    // 亲近

    if(idx>=3) push('rare_seed', 100, '稀有种子');

    if(idx>=3) push('fish_soup', 55, '鱼汤');
    if(idx>=4) push('stew', 75, '炖菜');
  }
  return list;
}

// 赠送礼物：扣除背包物品并正确累加好感；若已达当前上限（未完成任务则锁定知己上限），
// 不再消耗礼物，避免“物品消失好感不动”。返回 true=已赠送并累加，false=被上限拦截。
function tryGiveGift(id, k){
  const npc=map.npcs.find(n=>n.id===id);
  // 料理不能送礼（全局规则）
  if(GIFT_BLOCKED[k]){ toast('料理不能作为礼物赠送'); return false; }
  const pref=NPC_GIFT[id];
  let inc;
  if(pref && pref.like && pref.like.indexOf(k)>=0) inc=12;
  else if(pref && pref.dislike && pref.dislike.indexOf(k)>=0) inc=-6;
  else inc = (k==='flower'||k==='berry')?8: (k.indexOf('seed')>=0?3:5);
  const before = state.goodwill[id]||0;
  // 上限保护：好感已达当前上限时，赠送不再消耗物品（厌恶-好感除外，仍可降低）
  if(inc>0 && before >= favorCap(id)){
    toast('TA对你的好感已达当前上限，完成TA的专属任务后可继续增进~');
    return false;
  }
  state.inv[k] = (state.inv[k]||0) - 1; if(state.inv[k]<=0) delete state.inv[k];
  addFavor(id, inc);
  save();
  toast(inc>=0? ('好感 +'+inc) : ('好感 '+inc));
  return true;
}

function openGift(id){
  const p=openBlankPopup('送礼 · '+(map.npcs.find(n=>n.id===id).name), {});

  finalizePopup(p);

/* ================= 弹窗系统 ================= */
let currentPopup=null;
function openBlankPopup(title, opts){
  // 同时间仅允许1个弹窗：直接覆盖
  const pw=Math.min(680, cw-40);
  const ph=Math.min(520, ch-60);
  const p={
    title, items:[], tabs:null, activeTab:0, scrollY:0, scrollMax:0,
    px:0,py:0,pw,ph, titleH:50, tabsH:0, _cy:0, data:opts&&opts.data||{},
  };
  currentPopup=p;
  return p;
}
function closePopup(){ currentPopup=null; }
function addText(p, text, x, w, color, size){
  setFont(size||14, false);
  const lines=wrapText(text, w);
  const lh=(size||14)+6;
  const h=lines.length*lh;
  p.items.push({type:'text', x, y:p._cy, w, lines, color:color||COL.text, size:size||14, h});
  p._cy+=h+4;
}
function addBar(p, ratio, w){
  p.items.push({type:'bar', x:0, y:p._cy, w, ratio:clamp(ratio,0,1), h:14});
  p._cy+=18;
}
function addButton(p, label, x, w, h, action, enabled, color){
  p.items.push({type:'button', x, y:p._cy, w, h:h||30, label, action, enabled:enabled!==false, color:color||COL.accent});
  p._cy+= (h||30)+8;
}
function addGap(p,g){ p._cy+=g; }
function addDivider(p, w, color){
  p.items.push({type:'divider', x:0, y:p._cy, w, color:color||'#D8C3A0', h:1});
  p._cy+=16;
}
function finalizePopup(p){ /* 占位：scrollMax 在绘制时计算 */ }

function handlePopupClick(mx,my){
  const p=currentPopup; if(!p) return;
  const pad=18;
  const px=(cw-p.pw)/2, py=(ch-p.ph)/2, pw=p.pw, ph=p.ph;
  p.px=px; p.py=py;
  // 关闭叉
  if(mx>=px+pw-40 && mx<=px+pw-14 && my>=py+14 && my<=py+40){ closePopup(); return; }
  // tabs
  if(p.tabs){
    const tw=(pw-pad*2)/p.tabs.length;
    for(let i=0;i<p.tabs.length;i++){
      const tx=px+pad+i*tw;
      if(mx>=tx&&mx<=tx+tw-6&&my>=py+p.titleH+6&&my<=py+p.titleH+34){
        if(p.activeTab!==i){ p.activeTab=i; p.scrollY=0; if(p.onTab) p.onTab(i); }
        return;
      }
    }
  }
  // 内容按钮（叠加滚动偏移）
  const top=py+p.titleH+p.tabsH+pad;
  const localY = my - top + p.scrollY;
  for(const it of p.items){
    if(it.type!=='button') continue;
    if(mx>=px+pad+it.x && mx<=px+pad+it.x+it.w && localY>=it.y && localY<=it.y+it.h){
      if(it.enabled!==false) it.action();
      return;
    }
  }
}

function drawPopup(){
  const p=currentPopup; if(!p) return;
  const pad=18;
  const px=(cw-p.pw)/2, py=(ch-p.ph)/2;
  p.px=px; p.py=py;
  // 遮罩
  ctx.fillStyle=COL.mask; ctx.fillRect(0,0,cw,ch);
  // 面板
  rr(ctx,px,py,p.pw,p.ph,18); ctx.fillStyle=COL.panel; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle=COL.border; ctx.stroke();
  // 标题
  setFont(20,true); ctx.fillStyle=COL.text; ctx.textAlign='left';
  ctx.fillText(p.title, px+pad, py+34);
  ctx.textAlign='left';
  // 关闭叉
  ctx.strokeStyle=COL.sub; ctx.lineWidth=3;
  const cx=px+p.pw-27, cy=py+27;
  ctx.beginPath(); ctx.moveTo(cx-7,cy-7); ctx.lineTo(cx+7,cy+7); ctx.moveTo(cx+7,cy-7); ctx.lineTo(cx-7,cy+7); ctx.stroke();
  // tabs
  if(p.tabs){
    const tw=(p.pw-pad*2)/p.tabs.length;
    for(let i=0;i<p.tabs.length;i++){
      const tx=px+pad+i*tw, ty=py+p.titleH+6, th=28;
      rr(ctx,tx,ty,tw-6,th,8);
      ctx.fillStyle = (i===p.activeTab)?COL.accent:COL.barBg;
      ctx.fill();
      setFont(14, i===p.activeTab); ctx.fillStyle = (i===p.activeTab)?'#fff':COL.text;
      ctx.textAlign='center';
      ctx.fillText(p.tabs[i], tx+(tw-6)/2, ty+19);
      ctx.textAlign='left';
    }
    p.tabsH=40;
  } else p.tabsH=0;

  const top=py+p.titleH+p.tabsH+pad;
  const clipH = p.ph - p.titleH - p.tabsH - pad*2;
  const contentH=p._cy;
  p.scrollMax=Math.max(0, contentH-clipH);

  ctx.save();
  rr(ctx, px+pad, top, p.pw-pad*2, clipH, 8); ctx.clip();
  for(const it of p.items){
    const iy = top + it.y - p.scrollY;
    if(iy+it.h<top || iy>top+clipH) continue;
    const ix = px+pad+it.x;
    if(it.type==='text'){
      setFont(it.size,false); ctx.fillStyle=it.color; ctx.textAlign='left';
      for(let i=0;i<it.lines.length;i++){ ctx.fillText(it.lines[i], ix, iy+it.size+i*(it.size+6)); }
    } else if(it.type==='bar'){
      rr(ctx, ix, iy, it.w, it.h, 6); ctx.fillStyle=COL.barBg; ctx.fill();
      rr(ctx, ix, iy, it.w*it.ratio, it.h, 6); ctx.fillStyle=COL.accent2; ctx.fill();
    } else if(it.type==='divider'){
      ctx.strokeStyle=it.color; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(ix, iy+it.h/2); ctx.lineTo(ix+it.w, iy+it.h/2); ctx.stroke();
    } else if(it.type==='button'){
      const hover = mouseX>=ix&&mouseX<=ix+it.w&&mouseY>=iy&&mouseY<=iy+it.h;
      rr(ctx, ix, iy, it.w, it.h, 8);
      ctx.fillStyle = it.enabled===false? '#D8CDB5' : (hover? shade(it.color,-12): it.color);
      ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle=COL.border; ctx.stroke();
      setFont(14,true); ctx.fillStyle = it.enabled===false? COL.faint : '#fff';
      ctx.textAlign='center'; ctx.fillText(it.label, ix+it.w/2, iy+it.h/2+5);
      ctx.textAlign='left';
    } else if(it.type==='codex'){
      rr(ctx, ix, iy, it.w, it.w, 8); ctx.fillStyle='#fff'; ctx.fill();
      ctx.lineWidth=1.5; ctx.strokeStyle=COL.border; ctx.stroke();
      if(it.discovered){ drawItemIcon(it.id, ix+4, iy+4, it.w-8); }
      else { setFont(20,true); ctx.fillStyle=COL.faint; ctx.textAlign='center'; ctx.fillText('?', ix+it.w/2, iy+it.w/2+7); ctx.textAlign='left'; }
      setFont(11,false); ctx.fillStyle=COL.sub; ctx.textAlign='center';
      ctx.fillText(it.discovered?ITEMS[it.id].name:'未解锁', ix+it.w/2, iy+it.w+15); ctx.textAlign='left';
    } else if(it.type==='map'){
      const mw=it.w, mh=it.h;
      const sxk=mw/MAP_W, syk=mh/MAP_H;
      ctx.save(); rr(ctx, ix, iy, mw, mh, 6); ctx.clip();
      ctx.fillStyle=COL.grassA; ctx.fillRect(ix,iy,mw,mh);
      // 道路
      ctx.fillStyle=COL.road;
      map.road.forEach(k=>{ const a=k.split(','); ctx.fillRect(ix+(+a[0])*sxk, iy+(+a[1])*syk, Math.ceil(sxk)+1, Math.ceil(syk)+1); });
      // 水域
      ctx.fillStyle=COL.water;
      map.water.forEach(k=>{ const a=k.split(','); ctx.fillRect(ix+(+a[0])*sxk, iy+(+a[1])*syk, Math.ceil(sxk)+1, Math.ceil(syk)+1); });
      // 中央广场（瓷砖硬地）
      ctx.fillStyle=COL.plaza;
      map.plaza.forEach(k=>{ const a=k.split(','); ctx.fillRect(ix+(+a[0])*sxk, iy+(+a[1])*syk, Math.ceil(sxk)+1, Math.ceil(syk)+1); });
      // 中央广场（瓷砖硬地）— 区域名已统一为"望月中央广场"，不再单独标注
      // 农田位置（用户新规范：与四周各隔 1 格）— 棕色虚线框
      if(map.farmRects){
        ctx.strokeStyle='rgba(160,120,60,0.85)'; ctx.lineWidth=1.5; ctx.setLineDash([3,2]);
        for(const R of map.farmRects){ ctx.strokeRect(ix+R.x*sxk, iy+R.y*syk, R.w*sxk, R.h*syk); }
        ctx.setLineDash([]);
      }
      // 动物围栏（深棕实线框 + 上方 3 格入口留白）
      if(map.fenceRects){
        const R=map.fenceRects[0];
        ctx.strokeStyle='rgba(120,80,40,0.85)'; ctx.lineWidth=2;
        // 上方三格入口断开（用三段横线代替）
        ctx.beginPath(); ctx.moveTo(ix+R.x*sxk, iy+R.y*syk); ctx.lineTo(ix+14*sxk, iy+R.y*syk); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ix+17*sxk, iy+R.y*syk); ctx.lineTo(ix+(R.x+R.w)*sxk, iy+R.y*syk); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ix+R.x*sxk, iy+R.y*syk); ctx.lineTo(ix+R.x*sxk, iy+(R.y+R.h)*syk); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ix+(R.x+R.w)*sxk, iy+R.y*syk); ctx.lineTo(ix+(R.x+R.w)*sxk, iy+(R.y+R.h)*syk); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ix+R.x*sxk, iy+(R.y+R.h)*syk); ctx.lineTo(ix+(R.x+R.w)*sxk, iy+(R.y+R.h)*syk); ctx.stroke();
        // 上方入口高亮
        ctx.fillStyle='rgba(255,210,80,0.55)';
        ctx.fillRect(ix+14*sxk, iy+(R.y-0.3)*syk, 3*sxk, syk*0.6);
      }
      // 农田/围栏 文字标注
      setFont(9,true); ctx.fillStyle='rgba(100,70,30,0.85)';
      if(map.farmRects){ ctx.fillText('◌ 农田', ix+5*sxk+2, iy+32*syk+10); }
      if(map.fenceRects){ ctx.fillText('▣ 动物围栏', ix+10*sxk+2, iy+49*syk+10); }
      // 建筑 + 名称标记
      for(const b of map.buildings){
        ctx.fillStyle=COL.accent;
        ctx.fillRect(ix+b.tx*sxk, iy+b.ty*syk, b.tw*sxk, b.th*syk);
        setFont(8,true); ctx.fillStyle='rgba(40,28,16,0.9)';
        ctx.textAlign='center';
        ctx.fillText(b.mapName||b.label, ix+(b.tx+b.tw/2)*sxk, iy+b.ty*syk-2);
      }
      ctx.textAlign='left';
      // 遗迹三角（未发现=灰色模糊，已发现=金色高亮）
      for(const r of map.relics){
        const cx=ix+(r.tx+0.5)*sxk, cy=iy+(r.ty+0.5)*syk, found=!!state.relics[r.id];
        ctx.beginPath(); ctx.moveTo(cx,cy-5); ctx.lineTo(cx-4,cy+4); ctx.lineTo(cx+4,cy+4); ctx.closePath();
        ctx.fillStyle= found? '#E8B84B' : 'rgba(120,120,120,0.5)'; ctx.fill();
      }
      // NPC 彩色圆点（实时位置）
      for(const n of map.npcs){
        ctx.fillStyle=n.color;
        const cx=ix+(n.x/TILE)*sxk, cy=iy+(n.y/TILE)*syk;
        ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 6.28); ctx.fill();
        ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,0.75)'; ctx.stroke();
      }
      // 玩家箭头（橙色，指向朝向）
      const px0=ix+(state.px/TILE)*sxk, py0=iy+(state.py/TILE)*syk;
      ctx.save(); ctx.translate(px0,py0);
      const ang={up:-Math.PI/2, down:Math.PI/2, left:Math.PI, right:0}[state.dir]||0;
      ctx.rotate(ang);
      ctx.fillStyle='#FF8A1E';
      ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(-4,-4); ctx.lineTo(-4,4); ctx.closePath(); ctx.fill();
      ctx.restore();
      // 八大区域名称（最顶层绘制，覆盖建筑/NPC之上；望月中央广场 26px，其余 32px）
      const zones=[
        {name:'石陶谷',       x:0,  y:0,  w:20, h:19, fs:32},
        {name:'匠作坪',       x:20, y:0,  w:21, h:19, fs:32},
        {name:'木犀猎岭',     x:41, y:0,  w:33, h:19, fs:32},
        {name:'闲居坊',       x:0,  y:19, w:20, h:12, fs:32},
        {name:'望月中央广场', x:20, y:19, w:21, h:12, fs:26},
        {name:'通衢市井',     x:41, y:19, w:33, h:12, fs:32},
        {name:'归耕农场',     x:0,  y:31, w:30, h:20, fs:32},
        {name:'星湖湾',       x:30, y:31, w:44, h:20, fs:32},
      ];
      ctx.textAlign='center';
      for(const z of zones){
        setFont(z.fs,true);
        ctx.fillStyle='rgba(255,250,238,0.25)';
        const cx=ix+(z.x+z.w/2)*sxk, cy=iy+(z.y+z.h/2)*syk;
        ctx.fillText(z.name, cx, cy+10);
      }
      ctx.textAlign='left';
      ctx.restore();
      ctx.lineWidth=1.5; ctx.strokeStyle=COL.border; rr(ctx,ix,iy,mw,mh,6); ctx.stroke();
    }
  }
  ctx.restore();

  // 滚动条
  if(p.scrollMax>0){
    const sbX=px+p.pw-pad+2, sbW=6;
    const ratio=clipH/contentH;
    const thumbH=Math.max(24, clipH*ratio);
    const thumbY=top + (clipH-thumbH)*(p.scrollY/p.scrollMax);
    rr(ctx, sbX, top, sbW, clipH, 3); ctx.fillStyle='rgba(200,168,107,0.25)'; ctx.fill();
    rr(ctx, sbX, thumbY, sbW, thumbH, 3); ctx.fillStyle=COL.border; ctx.fill();
  }
  ctx.textAlign='left';
}
function shade(hex, amt){
  // 简单明暗
  if(hex[0]!=='#') return hex;
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=clamp(r+amt,0,255); g=clamp(g+amt,0,255); b=clamp(b+amt,0,255);
  return 'rgb('+r+','+g+','+b+')';
}

function openTasks(){
  const p=openBlankPopup('任务', {});
  p.tabs=['进行中','已完成'];
  p.activeTab=0;
  p.onTab=(i)=>{ buildTasksContent(p); };
  function buildTasksContent(pp){
    pp.items=[]; pp._cy=0;
    const pad=18, cw0=pp.pw-pad*2;
    if(pp.activeTab===0){
      // 进行中：已接取但未完成的链任务
      let any=false;
      for(const id of Object.keys(NPC_CHAINS)){
        const ch=NPC_CHAINS[id];
        const qs=state.quests[id];
        if(!qs||!qs.chainDone) continue;
        if(qs.accepted>=0 && qs.accepted<ch.length && !qs.chainDone[qs.accepted]){
          const st=ch[qs.accepted]; const npc=map.npcs.find(n=>n.id===id);
          any=true;
          addText(pp,'【'+st.name+'】'+(npc?('（'+npc.name+'）'):''),0,cw0,COL.text,15);
          addText(pp,st.desc,0,cw0,COL.sub,13);
          if(st.scene==='deliver'){
            const n=qs.deliver?Object.values(qs.deliver).filter(Boolean).length:0;
            addText(pp,'进展：已递交 '+n+'/'+st.targets.length+'（与对应NPC交谈交付）',0,cw0,COL.sub,13);
          } else if(st.scene==='interview'){
            const n=qs.interview?Object.values(qs.interview).filter(Boolean).length:0;
            addText(pp,'进展：已打听 '+n+'/'+st.targets.length+'（与对应NPC交谈）',0,cw0,COL.sub,13);
          } else if(st.scene==='rain_night'){
            addText(pp,'进展：雨天夜晚找阿溪即可完成',0,cw0,COL.sub,13);
          } else if(st.scene==='edge'){
            addText(pp,'进展：前往地图村外边缘即可完成',0,cw0,COL.sub,13);
          } else {
            let sat=true;
            for(const k in st.req){ const have=state.inv[k]||0; const ok=have>=st.req[k]; if(!ok) sat=false;
              addText(pp,(ok?'✓ ':'✗ ')+ITEMS[k].name+' '+have+'/'+st.req[k],0,cw0,ok?COL.accent2:COL.accent,13); }
            addText(pp, sat?'可前往提交':'物品不足',0,cw0, sat?COL.accent2:COL.accent,13);
          }
          addGap(pp,10);
        }
      }
      if(!any) addText(pp,'暂无可进行任务，提升好感后去找村民接取剧情任务吧',0,cw0,COL.sub,14);
    } else {
      // 已完成：所有 chainDone=true 的链任务
      let any=false;
      for(const id of Object.keys(NPC_CHAINS)){
        const ch=NPC_CHAINS[id];
        const qs=state.quests[id];
        if(!qs||!qs.chainDone) continue;
        const npc=map.npcs.find(n=>n.id===id);
        for(let i=0;i<ch.length;i++){ if(qs.chainDone[i]){ any=true; addText(pp,'✓ '+ch[i].name+' — '+ch[i].desc+(npc?('（'+npc.name+'）'):''),0,cw0,COL.accent2,14); addGap(pp,8); } }
      }
      if(!any) addText(pp,'还没有已完成的剧情任务',0,cw0,COL.sub,14);
    }
  }
  buildTasksContent(p);
  finalizePopup(p);
}

    // 简介：随总好感实时累计解锁的层级文本（自动换行）
    const bio=NPC_BIO[npc.id];
    if(bio){
      for(let t=0; t<=fi.idx && t<bio.length; t++){
        addText(p, (t>0?('〔'+FAVOR_TIERS[t]+'〕'):'')+bio[t], 0, cw0, (t===fi.idx?COL.text:COL.sub), 13);
      }
    }
    // 往事秘辛板块：未达成条件显示灰色提示；达成后展示对应文本（分段解锁）
    if(NPC_SECRET[npc.id]){
      const su=storyUnlocked(npc.id);
      if(su.shallow||su.mid||su.ultimate){
        addGap(p,4);
        addText(p,'【往事秘辛】', 0, cw0, COL.accent, 13);
        if(su.shallow){ addText(p,'〔浅层往事〕'+NPC_SECRET[npc.id].shallow, 0, cw0, COL.sub, 13); }
        if(su.mid){ addText(p,'〔中层过往〕'+NPC_SECRET[npc.id].mid, 0, cw0, COL.sub, 13); }
        if(su.ultimate){ addText(p,'〔终极秘辛〕'+NPC_SECRET[npc.id].ultimate, 0, cw0, COL.sub, 13); }
        addText(p,'〔名册〕'+NPC_SECRET[npc.id].roster, 0, cw0, COL.sub, 13);
      } else {
        addGap(p,4);
        addText(p,'完成对应NPC任务 + 提升好感解锁往事秘辛', 0, cw0, COL.faint, 12);
      }
    } else if(npc.child){
      // 孩童无往事秘辛：天真烟火气
      addGap(p,4);
      addText(p,'（孩童的天真里，藏着村子最寻常也最珍贵的烟火气。）', 0, cw0, COL.sub, 12);
    }
    // 分割线（浅棕色细线，最后一条不加）
    if(ni < map.npcs.length-1) addDivider(p, cw0, '#D8C3A0');
    else addGap(p, 10);
  });
  // 全局主线入口：集齐全部10位NPC至交+支线后，由玩家在此拼合“古农田遗迹”完整真相
  if(state.mainStoryUnlocked || allSecretsComplete()){
    addGap(p,6);
    addText(p,'【主线 · 古农田遗迹】你已集齐十位村民各自交出的碎片，真相就在拼图之间。', 0, cw0, COL.accent, 13);
    addGap(p,4);
    addButton(p,'▶ 拼合千年古农田遗迹真相', 0, cw0, 36, ()=>{ openMainStory(); }, true, COL.accent);
  }
  finalizePopup(p);
}

/* ================= UI 按钮 ================= */
let menuButtons=[], bottomButtons=[], invSlotsRender=[];
function buildMenuButtons(){
  menuButtons=[];
  const labels=['地图','任务','图鉴','名册','帮助'];
  const acts=[openMapPopup, openTasks, openCodex, openRoster, openHelp];
  const bw=64, bh=34, gap=6;
  const total=labels.length*(bw+gap)-gap;
  let x=cw-total-14, y=52;   // 紧贴缩小后的顶部状态栏（h=36，底边44）+8px，靠右对齐；样式/文字/交互完全不变，仅改变绘制位置
  for(let i=0;i<labels.length;i++){
    menuButtons.push({x:x+i*(bw+gap), y, w:bw, h:bh, label:labels[i], action:acts[i]});
  }
}
function buildBottomButtons(){
  bottomButtons=[];
  const labels=['种植','采集','钓鱼','畜牧','睡觉','凿石','伐木','背包'];
  const acts=[doPlant,doCollect,doFish,doAnimal,doSleep,doMine,doChop,toggleInventory];
  const n=labels.length;
  const small = cw < 760;
  if(!small){
    // 桌面：底部单行居中（原有逻辑不变）
    const bw=80, bh=46, gap=6;
    const total=n*bw+(n-1)*gap;
    let x=(cw-total)/2, y=ch-bh-12;
    for(let i=0;i<n;i++){
      bottomButtons.push({x:x+i*(bw+gap), y, w:bw, h:bh, label:labels[i], action:acts[i]});
    }
  } else {
    // 小屏：动作栏换行置于右下区域，避开左下角虚拟 D-pad
    const dpadW=144+24, bw=64, bh=42, gap=6;
    const avail=Math.max(bw, cw-dpadW-12);
    const perRow=Math.max(1, Math.floor((avail+gap)/(bw+gap)));
    const rows=Math.ceil(n/perRow);
    const blockH=rows*bh+(rows-1)*gap;
    const rowW=Math.min(avail, perRow*(bw+gap)-gap);
    const sx=cw-12-rowW, sy=ch-12-blockH;
    for(let i=0;i<n;i++){
      const r=Math.floor(i/perRow), c=i%perRow;
      bottomButtons.push({x:sx+c*(bw+gap), y:sy+r*(bh+gap), w:bw, h:bh, label:labels[i], action:acts[i]});
    }
  }
}

/* ================= 渲染 ================= */
function drawItemIcon(id, x, y, s){
  const it=ITEMS[id]; if(!it) return;
  ctx.save();
  ctx.translate(x+s/2, y+s/2);
  ctx.fillStyle=it.color;
  const sh=it.shape;
  if(sh==='seed'){ rr(ctx,-s*0.18,-s*0.28,s*0.36,s*0.56,4); ctx.fill(); }
  else if(sh==='grain'){ for(let i=-1;i<=1;i++){ rr(ctx,i*s*0.16-s*0.06,-s*0.3,s*0.12,s*0.6,3); ctx.fill(); } }
  else if(sh==='root'){ ctx.beginPath(); ctx.moveTo(0,s*0.3); ctx.quadraticCurveTo(s*0.28,0,0,-s*0.3); ctx.quadraticCurveTo(-s*0.28,0,0,s*0.3); ctx.fill(); }
  else if(sh==='round'){ ctx.beginPath(); ctx.arc(0,0,s*0.28,0,6.28); ctx.fill(); ctx.fillStyle='#7fae4e'; ctx.beginPath(); ctx.moveTo(0,-s*0.28); ctx.lineTo(s*0.12,-s*0.4); ctx.lineTo(-s*0.05,-s*0.3); ctx.fill(); }
  else if(sh==='log'){ rr(ctx,-s*0.3,-s*0.16,s*0.6,s*0.32,5); ctx.fill(); ctx.fillStyle='#c89a6a'; ctx.beginPath(); ctx.arc(-s*0.3,0,s*0.16,0,6.28); ctx.fill(); }
  else if(sh==='rock'){ ctx.beginPath(); ctx.moveTo(-s*0.3,s*0.2); ctx.lineTo(-s*0.1,-s*0.25); ctx.lineTo(s*0.2,-s*0.28); ctx.lineTo(s*0.3,s*0.15); ctx.lineTo(0,s*0.28); ctx.closePath(); ctx.fill(); }
  else if(sh==='leaf'){ ctx.beginPath(); ctx.ellipse(0,0,s*0.16,s*0.3,0.5,0,6.28); ctx.fill(); }
  else if(sh==='berry'){ ctx.beginPath(); ctx.arc(-s*0.1,0,s*0.16,0,6.28); ctx.arc(s*0.12,0.05,s*0.14,0,6.28); ctx.arc(0,s*0.12,s*0.13,0,6.28); ctx.fill(); }
  else if(sh==='mush'){ ctx.fillStyle='#F0E6D2'; rr(ctx,-s*0.08,-s*0.05,s*0.16,s*0.3,3); ctx.fill(); ctx.fillStyle=it.color; ctx.beginPath(); ctx.arc(0,-s*0.05,s*0.26,Math.PI,0); ctx.fill(); }
  else if(sh==='flower'){ for(let a=0;a<6;a++){ ctx.beginPath(); ctx.arc(Math.cos(a)*s*0.18,Math.sin(a)*s*0.18,s*0.1,0,6.28); ctx.fill(); } ctx.fillStyle='#F2D24A'; ctx.beginPath(); ctx.arc(0,0,s*0.1,0,6.28); ctx.fill(); }
  else if(sh==='fish'){ ctx.beginPath(); ctx.ellipse(-s*0.05,0,s*0.28,s*0.16,0,0,6.28); ctx.fill(); ctx.beginPath(); ctx.moveTo(s*0.2,0); ctx.lineTo(s*0.34,-s*0.14); ctx.lineTo(s*0.34,s*0.14); ctx.closePath(); ctx.fill(); }
  else if(sh==='shrimp'){ ctx.beginPath(); ctx.arc(0,0,s*0.22,0,6.28); ctx.fill(); }
  else if(sh==='bottle'){ rr(ctx,-s*0.14,-s*0.28,s*0.28,s*0.5,4); ctx.fill(); }
  else if(sh==='egg'){ ctx.beginPath(); ctx.ellipse(0,0,s*0.18,s*0.24,0,0,6.28); ctx.fill(); }
  else if(sh==='fluff'){ ctx.beginPath(); ctx.arc(-s*0.08,-s*0.05,s*0.18,0,6.28); ctx.arc(s*0.1,-s*0.05,s*0.16,0,6.28); ctx.arc(0,s*0.08,s*0.18,0,6.28); ctx.fill(); }
  else if(sh==='coin'){ ctx.beginPath(); ctx.arc(0,0,s*0.26,0,6.28); ctx.fill(); ctx.fillStyle='#B8932E'; ctx.font='bold '+(s*0.3)+'px sans-serif'; ctx.textAlign='center'; ctx.fillText('¥',0,s*0.1); ctx.textAlign='left'; }
  else if(sh==='bag'){ rr(ctx,-s*0.22,-s*0.1,s*0.44,s*0.36,5); ctx.fill(); ctx.fillStyle='#A8842F'; rr(ctx,-s*0.08,-s*0.22,s*0.16,s*0.14,3); ctx.fill(); }
  else if(sh==='rod'){ ctx.strokeStyle=it.color; ctx.lineWidth=s*0.07; ctx.beginPath(); ctx.moveTo(-s*0.28,s*0.28); ctx.lineTo(s*0.28,-s*0.28); ctx.stroke(); }
  else { rr(ctx,-s*0.25,-s*0.25,s*0.5,s*0.5,4); ctx.fill(); }
  ctx.restore();
}

function drawWorld(){
  // 地面
  const x0=Math.floor(cam.x/TILE), y0=Math.floor(cam.y/TILE);
  const x1=Math.ceil((cam.x+cw)/TILE), y1=Math.ceil((cam.y+ch)/TILE);
  for(let tx=x0;tx<=x1;tx++){
    for(let ty=y0;ty<=y1;ty++){
      if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) continue;
      const sx=tx*TILE-cam.x, sy=ty*TILE-cam.y;
      if(map.road.has(key(tx,ty))){
        ctx.fillStyle=COL.road; ctx.fillRect(sx,sy,TILE,TILE);
        ctx.strokeStyle=COL.roadLine; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(sx+TILE/2,sy+6); ctx.lineTo(sx+TILE/2,sy+TILE-6); ctx.stroke();
      } else if(map.plaza.has(key(tx,ty))){
        // 中央广场：瓷砖硬地（双色棋盘，瓦缝描边），覆盖默认草地
        ctx.fillStyle=((tx+ty)&1)?COL.plaza:COL.plaza2; ctx.fillRect(sx,sy,TILE,TILE);
        ctx.strokeStyle='rgba(150,128,92,0.45)'; ctx.lineWidth=1; ctx.strokeRect(sx+0.5,sy+0.5,TILE-1,TILE-1);
      } else if(map.water.has(key(tx,ty))){
        ctx.fillStyle=((tx+ty)&1)?COL.water:COL.water2; ctx.fillRect(sx,sy,TILE,TILE);
      } else {
        ctx.fillStyle=((tx+ty)&1)?COL.grassA:COL.grassB; ctx.fillRect(sx,sy,TILE,TILE);
        // 围栏瓦片：草地上叠加深棕色 fence 短竖线
        if(map.fence && map.fence.has(key(tx,ty))){
          ctx.strokeStyle='#7A5236'; ctx.lineWidth=2;
          ctx.beginPath(); ctx.moveTo(sx+TILE/2,sy+5); ctx.lineTo(sx+TILE/2,sy+TILE-5); ctx.stroke();
          ctx.strokeStyle='rgba(122,82,54,0.5)'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(sx+TILE/2-3,sy+TILE/2); ctx.lineTo(sx+TILE/2+3,sy+TILE/2); ctx.stroke();
        }
      }
    }
  }
  // 农田（按 y 排序与角色/建筑一起深度绘制）
  const drawables=[];
  for(const p of map.plots){ drawables.push({y:(p.ty+0.5)*TILE, kind:'plot', o:p}); }
  for(const b of map.buildings){ drawables.push({y:(b.ty+b.th)*TILE, kind:'building', o:b}); }
  for(const t of map.trees){ drawables.push({y:(t.ty+1)*TILE, kind:'tree', o:t}); }
  for(const r of map.rocks){ drawables.push({y:(r.ty+1)*TILE, kind:'rock', o:r}); }
  for(const npc of map.npcs){ drawables.push({y:npc.y+8, kind:'npc', o:npc}); }
  for(const a of map.animals){ drawables.push({y:(a.ty+1)*TILE, kind:'animal', o:a}); }
  drawables.push({y:state.py+8, kind:'player', o:null});
  drawables.sort((A,B)=>A.y-B.y);

  for(const d of drawables){
    if(d.kind==='plot') drawPlot(d.o);
    else if(d.kind==='building') drawBuilding(d.o);
    else if(d.kind==='tree') drawTree(d.o);
    else if(d.kind==='rock') drawRock(d.o);
    else if(d.kind==='npc'){ if(!npcHidden(d.o)) drawActor(d.o.x,d.o.y,d.o.color,d.o.id,'npc'); }
    else if(d.kind==='animal') drawAnimal(d.o);
    else if(d.kind==='player') drawActor(state.px,state.py,'#D86b5b','player',state.dir);
  }
  // 采集物（画在地面层上方，独立，不参与深度也可）
  for(const r of map.resources){
    const sx=(r.tx+0.5)*TILE-cam.x, sy=(r.ty+0.9)*TILE-cam.y;
    drawResource(r, sx, sy);
  }
  // 睡觉 zzz
  if(state.sleeping && nearPlayerHouse()){
    const hx=5*TILE-cam.x, hy=44*TILE-cam.y;
    drawZZZ(hx, hy);
  }
}

function drawPlot(p){
  const sx=p.tx*TILE-cam.x, sy=p.ty*TILE-cam.y;
  if(p.stage==='wild'){
    ctx.fillStyle='rgba(150,110,60,0.18)'; rr(ctx,sx+4,sy+4,TILE-8,TILE-8,6); ctx.fill();
    ctx.strokeStyle='rgba(120,85,45,0.5)'; ctx.setLineDash([5,4]); ctx.lineWidth=2; rr(ctx,sx+4,sy+4,TILE-8,TILE-8,6); ctx.stroke(); ctx.setLineDash([]);
    return;
  }
  // 土壤
  ctx.fillStyle = p.watered? COL.plotTill2: COL.plotTill;
  rr(ctx,sx+3,sy+3,TILE-6,TILE-6,6); ctx.fill();
  ctx.strokeStyle='#6f4a26'; ctx.lineWidth=2; rr(ctx,sx+3,sy+3,TILE-6,TILE-6,6); ctx.stroke();
  // 犁沟
  ctx.strokeStyle='rgba(110,74,38,0.5)'; ctx.lineWidth=1.5;
  for(let i=1;i<3;i++){ ctx.beginPath(); ctx.moveTo(sx+8,sy+3+i*13); ctx.lineTo(sx+TILE-8,sy+3+i*13); ctx.stroke(); }
  const cx=sx+TILE/2, cy=sy+TILE/2;
  if(p.stage==='seeded'){
    ctx.fillStyle=COL.plotSeed; ctx.fillRect(cx-2,cy,4,10); ctx.beginPath(); ctx.ellipse(cx,cy-2,6,4,0,0,6.28); ctx.fill();
  } else if(p.stage==='growing'){
    ctx.fillStyle=COL.plotGrow;
    ctx.beginPath(); ctx.ellipse(cx-5,cy-2,5,9,0,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+5,cy-2,5,9,0,0,6.28); ctx.fill();
    ctx.fillRect(cx-2,cy+4,4,8);
  } else if(p.stage==='mature'){
    const c=ITEMS[p.crop]?ITEMS[p.crop].color:'#e7c24a';
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.arc(cx,cy-4,11,0,6.28); ctx.fill();
    ctx.fillStyle='#7fae4e'; ctx.fillRect(cx-2,cy+4,4,10);
  }
}
function drawTree(t){
  const sx=(t.tx+0.5)*TILE-cam.x, sy=(t.ty+1)*TILE-cam.y;
  ctx.fillStyle=COL.shadow; ctx.beginPath(); ctx.ellipse(sx,sy-2,16,6,0,0,6.28); ctx.fill();
  if(t.depleted){ ctx.fillStyle='#6b4a2a'; rr(ctx,sx-6,sy-10,12,10,3); ctx.fill(); return; }
  ctx.fillStyle='#8a5a32'; rr(ctx,sx-5,sy-26,10,26,3); ctx.fill();
  ctx.fillStyle='#7fae4e'; ctx.beginPath(); ctx.arc(sx,sy-34,20,0,6.28); ctx.fill();
  ctx.fillStyle='#8fbf5a'; ctx.beginPath(); ctx.arc(sx-8,sy-40,12,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(sx+9,sy-38,11,0,6.28); ctx.fill();
}
function drawRock(r){
  const sx=(r.tx+0.5)*TILE-cam.x, sy=(r.ty+1)*TILE-cam.y;
  ctx.fillStyle=COL.shadow; ctx.beginPath(); ctx.ellipse(sx,sy-2,16,6,0,0,6.28); ctx.fill();
  if(r.depleted){ ctx.fillStyle='#7a8085'; ctx.beginPath(); ctx.arc(sx-3,sy-3,5,0,6.28); ctx.arc(sx+4,sy-4,4,0,6.28); ctx.arc(sx,sy-7,3,0,6.28); ctx.fill(); return; }
  ctx.fillStyle='#9AA0A6'; ctx.beginPath(); ctx.moveTo(sx-16,sy-4); ctx.lineTo(sx-6,sy-22); ctx.lineTo(sx+10,sy-24); ctx.lineTo(sx+17,sy-6); ctx.lineTo(sx+2,sy+2); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#b7bcc1'; ctx.beginPath(); ctx.moveTo(sx-6,sy-22); ctx.lineTo(sx+10,sy-24); ctx.lineTo(sx+2,sy-10); ctx.closePath(); ctx.fill();
}
function drawBuilding(b){
  const sx=b.tx*TILE-cam.x, sy=b.ty*TILE-cam.y;
  const w=b.tw*TILE, h=b.th*TILE;
  // 阴影
  ctx.fillStyle=COL.shadow; ctx.fillRect(sx+6,sy+h-6,w-12,8);

  if(b.id==='bbq'){
    // 露营地：帐篷
    ctx.fillStyle='#C9A06B'; ctx.beginPath(); ctx.moveTo(sx+6,sy+h-6); ctx.lineTo(sx+w/2,sy+14); ctx.lineTo(sx+w-6,sy+h-6); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#7a5230'; rr(ctx,sx+w/2-10,sy+h-30,20,24,3); ctx.fill();
    ctx.fillStyle='#E0A45E'; ctx.beginPath(); ctx.arc(sx+w/2,sy+14,5,0,6.28); ctx.fill();
    drawTag(sx+w/2, sy-6, b.label); return;
  }
  if(b.id==='tao'){
    // 陶叔陶坊：窑炉造型，烟囱，陶罐装饰
    ctx.fillStyle='#E8C8A0'; rr(ctx,sx+4,sy+h*0.35,w-8,h*0.65-4,4); ctx.fill();
    ctx.fillStyle='#B5703C'; ctx.beginPath(); ctx.moveTo(sx-2,sy+h*0.38); ctx.lineTo(sx+w/2,sy+8); ctx.lineTo(sx+w+2,sy+h*0.38); ctx.closePath(); ctx.fill();
    // 烟囱
    ctx.fillStyle='#8B6B4A'; rr(ctx,sx+w*0.7,sy+2,14,h*0.3,2); ctx.fill();
    ctx.fillStyle='rgba(180,180,180,0.5)'; ctx.beginPath(); ctx.arc(sx+w*0.7+7,sy-2,6,0,6.28); ctx.fill();
    // 陶罐装饰
    ctx.fillStyle='#C98B5A'; ctx.beginPath(); ctx.ellipse(sx+18,sy+h-18,8,10,0,0,6.28); ctx.fill();
    ctx.fillStyle='#D9A06B'; ctx.beginPath(); ctx.ellipse(sx+w-18,sy+h-20,6,8,0,0,6.28); ctx.fill();
    // 门
    ctx.fillStyle='#7a5230'; rr(ctx,sx+w/2-12,sy+h-34,24,30,4); ctx.fill();
    drawTag(sx+w/2, sy-6, b.label); return;
  }
  if(b.id==='carpenter'){
    // 木伯工坊：木屋风格，可见木梁，锯木架
    ctx.fillStyle='#C8A878'; rr(ctx,sx+4,sy+h*0.4,w-8,h*0.6-4,4); ctx.fill();
    ctx.fillStyle='#9FA86B'; ctx.beginPath(); ctx.moveTo(sx-4,sy+h*0.42); ctx.lineTo(sx+w/2,sy+6); ctx.lineTo(sx+w+4,sy+h*0.42); ctx.closePath(); ctx.fill();
    // 木梁装饰
    ctx.strokeStyle='#8B6B3A'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(sx+10,sy+h*0.42); ctx.lineTo(sx+10,sy+h-6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+w-10,sy+h*0.42); ctx.lineTo(sx+w-10,sy+h-6); ctx.stroke();
    // 锯木架
    ctx.strokeStyle='#7a5230'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx+w+4,sy+h-20); ctx.lineTo(sx+w+14,sy+h-10); ctx.lineTo(sx+w+4,sy+h-6); ctx.stroke();
    // 门
    ctx.fillStyle='#6a4220'; rr(ctx,sx+w/2-12,sy+h-34,24,30,4); ctx.fill();
    // 窗（木框）
    ctx.fillStyle='#cfe0e8'; rr(ctx,sx+16,sy+h*0.52,14,14,2); ctx.fill();
    ctx.strokeStyle='#8B6B3A'; ctx.lineWidth=2; rr(ctx,sx+16,sy+h*0.52,14,14,2); ctx.stroke();
    drawTag(sx+w/2, sy-6, b.label); return;
  }
  if(b.id==='yuan'){
    // 阿远猎屋：猎人小屋，斜屋顶，鹿角装饰
    ctx.fillStyle='#A8B890'; rr(ctx,sx+4,sy+h*0.42,w-8,h*0.58-4,4); ctx.fill();
    ctx.fillStyle='#6B8A5B'; ctx.beginPath(); ctx.moveTo(sx-6,sy+h*0.44); ctx.lineTo(sx+w/2,sy+4); ctx.lineTo(sx+w+6,sy+h*0.44); ctx.closePath(); ctx.fill();
    // 鹿角装饰
    ctx.strokeStyle='#8B6B3A'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx+w/2-8,sy+10); ctx.lineTo(sx+w/2-14,sy-2); ctx.lineTo(sx+w/2-10,sy-8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+w/2-14,sy-2); ctx.lineTo(sx+w/2-18,sy-6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+w/2+8,sy+10); ctx.lineTo(sx+w/2+14,sy-2); ctx.lineTo(sx+w/2+10,sy-8); ctx.stroke();

    // 门（兽皮帘）
    ctx.fillStyle='#8B6B3A'; rr(ctx,sx+w/2-12,sy+h-34,24,30,4); ctx.fill();
