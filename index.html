  }
  if(b.id==='cui'){
    // 翠姐酒馆：温暖红棕，灯笼，酒桶
    ctx.fillStyle='#F3E8CC'; rr(ctx,sx+4,sy+h*0.4,w-8,h*0.6-4,4); ctx.fill();
    ctx.fillStyle='#C96B8A'; ctx.beginPath(); ctx.moveTo(sx-4,sy+h*0.42); ctx.lineTo(sx+w/2,sy+6); ctx.lineTo(sx+w+4,sy+h*0.42); ctx.closePath(); ctx.fill();
    // 灯笼
    ctx.fillStyle='#E8A040'; ctx.beginPath(); ctx.arc(sx+w/2,sy+h*0.42+8,6,0,6.28); ctx.fill();
    ctx.fillStyle='#FFD060'; ctx.beginPath(); ctx.arc(sx+w/2,sy+h*0.42+8,4,0,6.28); ctx.fill();
    // 酒桶
    ctx.fillStyle='#8B6B3A'; ctx.beginPath(); ctx.ellipse(sx+14,sy+h-16,8,10,0,0,6.28); ctx.fill();
    ctx.strokeStyle='#6a4a2a'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(sx+14,sy+h-16,8,10,0,0,6.28); ctx.stroke();
    // 大门
    ctx.fillStyle='#7a5230'; rr(ctx,sx+w/2-16,sy+h-38,32,34,4); ctx.fill();
    ctx.fillStyle='#E8A040'; ctx.beginPath(); ctx.arc(sx+w/2+10,sy+h-22,3,0,6.28); ctx.fill();
    drawTag(sx+w/2, sy-6, b.label); return;
  }
  if(b.id==='granny'){
    // 游村长家：庄重典雅，石基，双窗，门牌
    ctx.fillStyle='#EFE2C4'; rr(ctx,sx+4,sy+h*0.38,w-8,h*0.62-4,4); ctx.fill();
    // 石基
    ctx.fillStyle='#B0A08A'; rr(ctx,sx+4,sy+h-16,w-8,12,2); ctx.fill();
    ctx.fillStyle='#C98B6B'; ctx.beginPath(); ctx.moveTo(sx-4,sy+h*0.4); ctx.lineTo(sx+w/2,sy+4); ctx.lineTo(sx+w+4,sy+h*0.4); ctx.closePath(); ctx.fill();
    // 门牌
    ctx.fillStyle='#8B6B3A'; rr(ctx,sx+w/2-10,sy+h*0.4+2,20,12,2); ctx.fill();
    ctx.fillStyle='#E8C080'; setFont(8,true); ctx.textAlign='center'; ctx.fillText('村长',sx+w/2,sy+h*0.4+12); ctx.textAlign='left';
    // 双窗
    ctx.fillStyle='#cfe0e8'; rr(ctx,sx+12,sy+h*0.52,16,16,3); ctx.fill(); rr(ctx,sx+w-28,sy+h*0.52,16,16,3); ctx.fill();
    // 门
    ctx.fillStyle='#7a5230'; rr(ctx,sx+w/2-14,sy+h-38,28,34,4); ctx.fill();
    drawTag(sx+w/2, sy-6, b.label); return;
  }
  if(b.id==='player'){
    // 玩家小屋：随等级变化
    const lv=state.houseLevel;
    const wallC=['#F1E6C8','#E8D8B0','#D8C8A0','#C8B890'][Math.min(lv-1,3)];
    const roofC=['#C98B6B','#B57A5A','#A06A4A','#8B5A3A'][Math.min(lv-1,3)];
    ctx.fillStyle=wallC; rr(ctx,sx+4,sy+h*0.4,w-8,h*0.6-4,4); ctx.fill();
    ctx.fillStyle=roofC; ctx.beginPath(); ctx.moveTo(sx-4,sy+h*0.42); ctx.lineTo(sx+w/2,sy+6); ctx.lineTo(sx+w+4,sy+h*0.42); ctx.closePath(); ctx.fill();
    // 门
    ctx.fillStyle='#7a5230'; rr(ctx,sx+w/2-12,sy+h-34,24,30,4); ctx.fill();
    // 窗
    ctx.fillStyle='#cfe0e8'; rr(ctx,sx+12,sy+h*0.55,16,16,3); ctx.fill(); rr(ctx,sx+w-28,sy+h*0.55,16,16,3); ctx.fill();
    // 等级星标
    if(lv>=2){ ctx.fillStyle='#E8C24A'; for(let i=0;i<lv-1;i++){ ctx.beginPath(); ctx.arc(sx+w/2-8+i*10,sy+18,3,0,6.28); ctx.fill(); } }
    drawTag(sx+w/2, sy-6, '我的家 lvl:'+lv); return;
  }
  if(b.id==='you'){
    // 许先生杂货铺：商铺风格，招牌，货架
    ctx.fillStyle='#F3E8CC'; rr(ctx,sx+4,sy+h*0.4,w-8,h*0.6-4,4); ctx.fill();
    ctx.fillStyle='#D8A24B'; ctx.beginPath(); ctx.moveTo(sx-2,sy+h*0.42); ctx.lineTo(sx+w/2,sy+8); ctx.lineTo(sx+w+2,sy+h*0.42); ctx.closePath(); ctx.fill();
    // 招牌
    ctx.fillStyle='#8B6B3A'; rr(ctx,sx+w/2-20,sy+h*0.42-4,40,14,3); ctx.fill();
    ctx.fillStyle='#E8C080'; setFont(9,true); ctx.textAlign='center'; ctx.fillText('杂货',sx+w/2,sy+h*0.42+7); ctx.textAlign='left';
    // 货架展示
    ctx.fillStyle='#C9A06B'; rr(ctx,sx+8,sy+h*0.55,10,10,2); ctx.fill(); rr(ctx,sx+22,sy+h*0.55,10,10,2); ctx.fill();
    // 门
    ctx.fillStyle='#7a5230'; rr(ctx,sx+w/2-12,sy+h-34,24,30,4); ctx.fill();
    drawTag(sx+w/2, sy-6, b.label); return;
  }
  if(b.id==='xinxin'){
    // 小信邮局：邮筒，信件装饰
    ctx.fillStyle='#EFE2C4'; rr(ctx,sx+4,sy+h*0.4,w-8,h*0.6-4,4); ctx.fill();
    ctx.fillStyle='#C96B9A'; ctx.beginPath(); ctx.moveTo(sx-2,sy+h*0.42); ctx.lineTo(sx+w/2,sy+8); ctx.lineTo(sx+w+2,sy+h*0.42); ctx.closePath(); ctx.fill();
    // 邮筒
    ctx.fillStyle='#C94040'; rr(ctx,sx+w-20,sy+h-36,12,24,4); ctx.fill();
    ctx.fillStyle='#A03030'; rr(ctx,sx+w-20,sy+h-36,12,6,3); ctx.fill();
    // 信件装饰
    ctx.fillStyle='#F0E0C0'; ctx.save(); ctx.translate(sx+16,sy+h*0.55); ctx.rotate(0.2); rr(ctx,-8,-5,16,10,2); ctx.fill(); ctx.restore();
    // 门
    ctx.fillStyle='#7a5230'; rr(ctx,sx+w/2-12,sy+h-34,24,30,4); ctx.fill();
    drawTag(sx+w/2, sy-6, b.label); return;
  }
  if(b.id==='zhishu'){
    // 书塾：学堂风格，书卷装饰，匾额
    ctx.fillStyle='#E8E0D0'; rr(ctx,sx+4,sy+h*0.38,w-8,h*0.62-4,4); ctx.fill();
    ctx.fillStyle='#6B8FC9'; ctx.beginPath(); ctx.moveTo(sx-4,sy+h*0.4); ctx.lineTo(sx+w/2,sy+4); ctx.lineTo(sx+w+4,sy+h*0.4); ctx.closePath(); ctx.fill();
    // 匾额
    ctx.fillStyle='#5A3A1A'; rr(ctx,sx+w/2-18,sy+h*0.4-2,36,14,3); ctx.fill();
    ctx.fillStyle='#E8D090'; setFont(10,true); ctx.textAlign='center'; ctx.fillText('书塾',sx+w/2,sy+h*0.4+9); ctx.textAlign='left';
    // 窗（书卷形）
    ctx.fillStyle='#cfe0e8'; rr(ctx,sx+12,sy+h*0.52,14,18,4); ctx.fill(); rr(ctx,sx+w-26,sy+h*0.52,14,18,4); ctx.fill();
    // 门
    ctx.fillStyle='#5A3A1A'; rr(ctx,sx+w/2-14,sy+h-38,28,34,4); ctx.fill();
    drawTag(sx+w/2, sy-6, b.label); return;
  }
  if(b.id==='zhishuHouse'){
    // 知书居所：文雅小屋，盆栽，窗纱
    ctx.fillStyle='#E8E0D0'; rr(ctx,sx+4,sy+h*0.4,w-8,h*0.6-4,4); ctx.fill();
    ctx.fillStyle='#6B8FC9'; ctx.beginPath(); ctx.moveTo(sx-4,sy+h*0.42); ctx.lineTo(sx+w/2,sy+6); ctx.lineTo(sx+w+4,sy+h*0.42); ctx.closePath(); ctx.fill();
    // 盆栽
    ctx.fillStyle='#8B6B3A'; rr(ctx,sx+10,sy+h-24,10,12,3); ctx.fill();
    ctx.fillStyle='#5A8A3A'; ctx.beginPath(); ctx.arc(sx+15,sy+h-28,8,0,6.28); ctx.fill();
    // 窗纱
    ctx.fillStyle='#E8D8F0'; rr(ctx,sx+12,sy+h*0.52,16,16,3); ctx.fill(); rr(ctx,sx+w-28,sy+h*0.52,16,16,3); ctx.fill();
    // 门
    ctx.fillStyle='#5A3A1A'; rr(ctx,sx+w/2-12,sy+h-34,24,30,4); ctx.fill();
    drawTag(sx+w/2, sy-6, b.label); return;
  }
  if(b.id==='axi'){
    // 阿溪渔屋：渔家风格，渔网，鱼干
    ctx.fillStyle='#E0D8C8'; rr(ctx,sx+4,sy+h*0.4,w-8,h*0.6-4,4); ctx.fill();
    ctx.fillStyle='#6BA0C9'; ctx.beginPath(); ctx.moveTo(sx-4,sy+h*0.42); ctx.lineTo(sx+w/2,sy+6); ctx.lineTo(sx+w+4,sy+h*0.42); ctx.closePath(); ctx.fill();
    // 渔网
    ctx.strokeStyle='#A0907A'; ctx.lineWidth=1;
    for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(sx+w-6,sy+h*0.45+i*10); ctx.lineTo(sx+w+8,sy+h*0.5+i*10); ctx.stroke(); }
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(sx+w-2+i*5,sy+h*0.42); ctx.lineTo(sx+w-2+i*5,sy+h*0.75); ctx.stroke(); }
    // 鱼干
    ctx.fillStyle='#C9A06B'; ctx.beginPath(); ctx.ellipse(sx+16,sy+h-16,10,5,0.3,0,6.28); ctx.fill();
    ctx.fillStyle='#8B7050'; ctx.beginPath(); ctx.moveTo(sx+26,sy+h-16); ctx.lineTo(sx+30,sy+h-18); ctx.lineTo(sx+30,sy+h-14); ctx.closePath(); ctx.fill();
    // 门
    ctx.fillStyle='#5A4A3A'; rr(ctx,sx+w/2-12,sy+h-34,24,30,4); ctx.fill();
    drawTag(sx+w/2, sy-6, b.label); return;
  }

  // 默认房屋（备用）
  ctx.fillStyle=b.wall||'#EFE2C4'; rr(ctx,sx+4,sy+h*0.42,w-8,h*0.58-4,4); ctx.fill();
  ctx.fillStyle=b.roof||'#C98B6B'; ctx.beginPath(); ctx.moveTo(sx-4,sy+h*0.45); ctx.lineTo(sx+w/2,sy+6); ctx.lineTo(sx+w+4,sy+h*0.45); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#7a5230'; rr(ctx,sx+w/2-12,sy+h-34,24,30,4); ctx.fill();
  ctx.fillStyle='#cfe0e8'; rr(ctx,sx+12,sy+h*0.55,16,16,3); ctx.fill(); rr(ctx,sx+w-28,sy+h*0.55,16,16,3); ctx.fill();
  drawTag(sx+w/2, sy-6, b.label);
}
function drawTag(cx, ty, text){
  setFont(13,true);
  const w=ctx.measureText(text).width+16;
  const x=cx-w/2, y=ty-18;
  rr(ctx,x,y,w,22,8); ctx.fillStyle='rgba(255,250,238,0.85)'; ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle=COL.border; ctx.stroke();
  ctx.fillStyle=COL.text; ctx.textAlign='center'; ctx.fillText(text,cx,y+15); ctx.textAlign='left';
}
function drawResource(r, sx, sy){
  ctx.fillStyle=COL.shadow; ctx.beginPath(); ctx.ellipse(sx,sy+2,12,4,0,0,6.28); ctx.fill();
  if(r.depleted){ ctx.fillStyle='#9a9a7a'; ctx.beginPath(); ctx.arc(sx,sy-4,6,0,6.28); ctx.fill(); return; }
  if(r.type==='berry'){ ctx.fillStyle='#5a8a3c'; ctx.beginPath(); ctx.arc(sx,sy-6,12,0,6.28); ctx.fill();
    ctx.fillStyle='#C0407A'; for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(sx-6+i*4,sy-8+(i%2)*4,3,0,6.28); ctx.fill(); } }
  else if(r.type==='fiber'){ ctx.strokeStyle='#7fae4e'; ctx.lineWidth=3; for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(sx+i*3,sy+4); ctx.lineTo(sx+i*4,sy-14); ctx.stroke(); } }
  else if(r.type==='mushroom'){ ctx.fillStyle='#F0E6D2'; rr(ctx,sx-3,sy-8,6,12,3); ctx.fill(); ctx.fillStyle='#D96B5B'; ctx.beginPath(); ctx.arc(sx,sy-8,8,Math.PI,0); ctx.fill(); }
  else { ctx.fillStyle='#6fae4e'; ctx.beginPath(); ctx.arc(sx,sy-6,9,0,6.28); ctx.fill(); ctx.fillStyle='#E58FB0'; ctx.beginPath(); ctx.arc(sx,sy-12,5,0,6.28); ctx.fill(); }
}
function drawAnimal(a){
  const sx=(a.tx+0.5)*TILE-cam.x, sy=(a.ty+1)*TILE-cam.y;
  ctx.fillStyle=COL.shadow; ctx.beginPath(); ctx.ellipse(sx,sy-2,16,5,0,0,6.28); ctx.fill();
  if(a.kind==='chicken'||a.kind==='duck'){
    ctx.fillStyle=a.color; ctx.beginPath(); ctx.ellipse(sx,sy-12,14,11,0,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+10,sy-18,7,0,6.28); ctx.fill();
    ctx.fillStyle='#E0893C'; ctx.beginPath(); ctx.moveTo(sx+16,sy-18); ctx.lineTo(sx+22,sy-16); ctx.lineTo(sx+16,sy-14); ctx.fill();
  } else {
    ctx.fillStyle=a.color; rr(ctx,sx-16,sy-22,32,22,10); ctx.fill();
    ctx.beginPath(); ctx.arc(sx-14,sy-24,9,0,6.28); ctx.fill();
    ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.arc(sx-18,sy-26,2,0,6.28); ctx.fill();
  }
}
function drawActor(x,y,color,id,dir){
  const sx=x-cam.x, sy=y-cam.y;
  const npc = id==='player'? null : map.npcs.find(n=>n.id===id);
  const isChild = npc && npc.child;
  const sc = isChild ? 0.7 : 1;  // 孩童缩放

  ctx.fillStyle=COL.shadow; ctx.beginPath(); ctx.ellipse(sx,sy-2,15*sc,5*sc,0,0,6.28); ctx.fill();

  // 腿（左右分别绘制）
  ctx.fillStyle='#5a4632';
  rr(ctx,sx-8*sc,sy-14*sc,7*sc,14*sc,3); ctx.fill();
  rr(ctx,sx+1*sc,sy-14*sc,7*sc,14*sc,3); ctx.fill();
  // 身体
  ctx.fillStyle=color; rr(ctx,sx-11*sc,sy-32*sc,22*sc,20*sc,8*sc); ctx.fill();
  // 头
  ctx.fillStyle='#F3D2A6'; ctx.beginPath(); ctx.arc(sx,sy-40*sc,11*sc,0,6.28); ctx.fill();

  // === 各NPC独特装饰 ===
  if(id==='player'){
    // 玩家：红帽子
    ctx.fillStyle='#D86b5b'; ctx.beginPath(); ctx.arc(sx,sy-46*sc,12*sc,Math.PI,0); ctx.fill(); ctx.fillRect(sx-12*sc,sy-46*sc,24*sc,4*sc);
  } else if(id==='tao'){
    // 陶叔：棕色围裙，头上毛巾
    ctx.fillStyle='#C98B5A'; rr(ctx,sx-10*sc,sy-28*sc,20*sc,12*sc,4*sc); ctx.fill(); // 围裙
    ctx.fillStyle='#E8D8C0'; rr(ctx,sx-10*sc,sy-50*sc,20*sc,4*sc,2*sc); ctx.fill(); // 毛巾
  } else if(id==='carpenter'){
    // 木伯：工作围裙，木屑
    ctx.fillStyle='#8B6B3A'; rr(ctx,sx-10*sc,sy-30*sc,20*sc,14*sc,4*sc); ctx.fill(); // 围裙
    ctx.fillStyle='#A08050'; ctx.beginPath(); ctx.arc(sx-8*sc,sy-46*sc,3*sc,0,6.28); ctx.fill(); // 木屑
  } else if(id==='yuan'){
    // 阿远：绿色兜帽
    ctx.fillStyle='#5A7A4A'; ctx.beginPath(); ctx.arc(sx,sy-42*sc,13*sc,Math.PI,0); ctx.fill();
    ctx.fillStyle='#5A7A4A'; rr(ctx,sx-13*sc,sy-42*sc,26*sc,6*sc,2*sc); ctx.fill();
  } else if(id==='cui'){
    // 翠姐：红棕围裙，发髻
    ctx.fillStyle='#C96B8A'; rr(ctx,sx-10*sc,sy-28*sc,20*sc,12*sc,4*sc); ctx.fill();
    ctx.fillStyle='#5a3a2a'; ctx.beginPath(); ctx.arc(sx,sy-52*sc,5*sc,0,6.28); ctx.fill(); // 发髻
  } else if(id==='granny'){
    // 游村长：典雅头巾
    ctx.fillStyle='#C9A080'; ctx.beginPath(); ctx.arc(sx,sy-44*sc,13*sc,Math.PI*0.8,Math.PI*0.2); ctx.fill();
    ctx.fillStyle='#C9A080'; rr(ctx,sx-12*sc,sy-46*sc,24*sc,5*sc,2*sc); ctx.fill();
  } else if(id==='you'){
    // 许先生：文人帽
    ctx.fillStyle='#8B7B5A'; ctx.beginPath(); ctx.arc(sx,sy-46*sc,10*sc,Math.PI,0); ctx.fill();
    ctx.fillStyle='#8B7B5A'; rr(ctx,sx-14*sc,sy-47*sc,28*sc,3*sc,2*sc); ctx.fill(); // 帽檐
  } else if(id==='xinxin'){
    // 小信：邮差帽，邮包
    ctx.fillStyle='#4A6A8A'; rr(ctx,sx-12*sc,sy-50*sc,24*sc,6*sc,3*sc); ctx.fill(); // 帽子
    ctx.fillStyle='#6A5A4A'; rr(ctx,sx+8*sc,sy-28*sc,10*sc,14*sc,3*sc); ctx.fill(); // 邮包
  } else if(id==='ling'){
    // 玲婆婆：紫色头巾
    ctx.fillStyle='#8A5A8A'; ctx.beginPath(); ctx.arc(sx,sy-44*sc,13*sc,Math.PI*0.8,Math.PI*0.2); ctx.fill();
    ctx.fillStyle='#8A5A8A'; rr(ctx,sx-12*sc,sy-46*sc,24*sc,5*sc,2*sc); ctx.fill();
  } else if(id==='zhishu'){
    // 知书：儒生帽，书卷
    ctx.fillStyle='#5A6A8A'; ctx.beginPath(); ctx.arc(sx,sy-46*sc,9*sc,Math.PI,0); ctx.fill();
    ctx.fillStyle='#5A6A8A'; rr(ctx,sx-4*sc,sy-54*sc,8*sc,10*sc,2*sc); ctx.fill(); // 帽顶
    ctx.fillStyle='#E8D8B0'; rr(ctx,sx-14*sc,sy-26*sc,8*sc,10*sc,2*sc); ctx.fill(); // 书卷
  } else if(id==='axi'){
    // 阿溪：渔夫帽，鱼篓
    ctx.fillStyle='#6A8A6A'; rr(ctx,sx-14*sc,sy-50*sc,28*sc,5*sc,3*sc); ctx.fill(); // 帽檐
    ctx.fillStyle='#6A8A6A'; ctx.beginPath(); ctx.arc(sx,sy-48*sc,8*sc,Math.PI,0); ctx.fill();
    ctx.fillStyle='#8A7A5A'; rr(ctx,sx+8*sc,sy-26*sc,9*sc,12*sc,3*sc); ctx.fill(); // 鱼篓
  } else if(id==='ale'){
    // 阿乐：小黄帽
    ctx.fillStyle='#E0A85B'; ctx.beginPath(); ctx.arc(sx,sy-44*sc,8*sc,Math.PI,0); ctx.fill();
    ctx.fillStyle='#E0A85B'; rr(ctx,sx-10*sc,sy-45*sc,20*sc,3*sc,2*sc); ctx.fill();
  } else if(id==='wan'){
    // 小晚：粉色蝴蝶结
    ctx.fillStyle='#D080A0'; ctx.beginPath(); ctx.arc(sx-6*sc,sy-50*sc,4*sc,0,6.28); ctx.fill();
    ctx.fillStyle='#D080A0'; ctx.beginPath(); ctx.arc(sx+6*sc,sy-50*sc,4*sc,0,6.28); ctx.fill();
    ctx.fillStyle='#D080A0'; ctx.beginPath(); ctx.arc(sx,sy-48*sc,3*sc,0,6.28); ctx.fill();
  } else {
    // 默认：深棕色头发
    ctx.fillStyle='#5a4632'; ctx.beginPath(); ctx.arc(sx,sy-46*sc,11*sc,Math.PI,0); ctx.fill();
  }

  // 眼睛
  ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.arc(sx-4*sc,sy-40*sc,1.6*sc,0,6.28); ctx.arc(sx+4*sc,sy-40*sc,1.6*sc,0,6.28); ctx.fill();

  if(id!=='player'){ drawTag(sx, sy-56*sc, map.npcs.find(n=>n.id===id).name); }
}
function drawZZZ(hx,hy){
  const sx=hx-cam.x, sy=hy-cam.y;
  setFont(18,true); ctx.fillStyle='#fff';
  ctx.fillText('Z',sx-18,sy-50); ctx.fillText('z',sx-6,sy-62); ctx.fillText('z',sx+4,sy-72);
}

/* ---------------- 顶部状态栏 ---------------- */
function drawTopBar(){
  const h=36;
  rr(ctx,8,8,cw-16,h,10); ctx.fillStyle='rgba(255,250,238,0.9)'; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=COL.border; ctx.stroke();
  const season=SEASONS[Math.floor((state.day-1)/SEASON_DAYS)%4];
  const dayOf=((state.day-1)%SEASON_DAYS)+1;
  const hh=Math.floor(state.time), mm=Math.floor((state.time-hh)*60);
  const timeStr=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  const fest = (state.day%7===0)?' · 集市日':'';
  const fc = (state.weatherDays>1)? state.weather : state.pendingWeather;
  // 单行水平流（h=36 紧凑版）：体力[bar]100/100 ｜ 季节 第N天【星期x】 ｜ 时间 hh:mm ｜ 天气 X(·集市日) ｜ 【次日天气预报】X
  const y=30;
  let x=20;
  setFont(13,true); ctx.fillStyle=COL.text; ctx.textAlign='left';
  // 体力
  ctx.fillText('体力', x, y);
  const bw=92, bx=x+36, by=y-12, bh=12;
  rr(ctx,bx,by,bw,bh,6); ctx.fillStyle=COL.barBg; ctx.fill();
  const ratio=state.stamina/state.maxStamina;
  rr(ctx,bx,by,bw*ratio,bh,6); ctx.fillStyle= ratio<0.3? '#E07B5B': COL.accent2; ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle=COL.border; rr(ctx,bx,by,bw,bh,6); ctx.stroke();
  setFont(10,false); ctx.fillText(Math.floor(state.stamina)+'/'+state.maxStamina, bx+bw/2-16, y);
  x = bx + bw + 18;
  // 季节 天数 星期
  const s1=season+'季 第'+dayOf+'天 【'+weekdayName()+'】';
  ctx.fillText(s1, x, y); x += ctx.measureText(s1).width + 18;
  // 时间
  const s2='时间 '+timeStr;
  ctx.fillText(s2, x, y); x += ctx.measureText(s2).width + 18;
  // 天气 + 节庆
  const wLabel='天气 '+state.weather;
  ctx.fillText(wLabel, x, y); x += ctx.measureText(wLabel).width + 10;
  if(fest){ ctx.fillText(fest, x, y); x += ctx.measureText(fest).width + 10; }
  // 次日天气预报
  ctx.fillStyle=COL.sub; ctx.fillText('【次日天气预报】'+fc, x, y);
}
function weatherNote(){
  const w=state.weather;
  if(w==='雷阵雨') return '雷阵雨：全田自动浇水，注意作物';
  if(w==='台风') return '台风：NPC居家，注意安全';
  if(w==='大雪') return '大雪：作物易枯死，体力消耗大增';
  if(w==='小雪') return '小雪：冬日专属采集物，玲婆婆居家';
  if(w==='大雨'||w==='小雨') return '雨天：适合作物生长';
  if(w==='霜冻') return '霜冻：天气寒冷';
  return '今日天气晴朗宜人';
}

/* ---------------- 底部操作栏 ---------------- */
function drawBottomBar(){
  for(const b of bottomButtons){
    const hover=mouseX>=b.x&&mouseX<=b.x+b.w&&mouseY>=b.y&&mouseY<=b.y+b.h;
    rr(ctx,b.x,b.y,b.w,b.h,12); ctx.fillStyle=hover?shade(COL.panelSolid,-8):COL.panelSolid; ctx.fill();
    ctx.lineWidth=2.5; ctx.strokeStyle=COL.border; ctx.stroke();
    setFont(16,true); ctx.fillStyle=COL.text; ctx.textAlign='center'; ctx.fillText(b.label,b.x+b.w/2,b.y+29); ctx.textAlign='left';
  }
}
// 功能按钮组（地图/任务/图鉴/名册/帮助）：原顶部5个橙色按钮，迁至顶部状态栏边框下方、靠右对齐，样式/文字/交互不变
function drawMenuButtons(){
  for(const b of menuButtons){
    const hover=mouseX>=b.x&&mouseX<=b.x+b.w&&mouseY>=b.y&&mouseY<=b.y+b.h;
    rr(ctx,b.x,b.y,b.w,b.h,10); ctx.fillStyle=hover?shade(COL.accent,-10):COL.accent; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle=COL.border; ctx.stroke();
    setFont(14,true); ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText(b.label,b.x+b.w/2,b.y+22); ctx.textAlign='left';
  }
}

/* ---------------- 背包（常驻，顶部状态栏边框下方，靠左对齐，展开时向下生长） ---------------- */
function drawInventory(){
  const idsAll=invIds();
  if(idsAll.length===0) return;
  const sw=38, gap=6, cols=5, pad=10;
  const expanded=state.invExpanded;
  const ids=expanded ? idsAll : idsAll.slice(0,5);
  const extra=!expanded && idsAll.length>5 ? idsAll.length-5 : 0;
  const rows=Math.ceil(ids.length/cols);
  const w=cols*sw+(cols-1)*gap+pad*2;
  const h=rows*sw+(rows-1)*gap+pad*2;
  const x=10, y=52;   // 紧贴缩小后的顶部状态栏（h=36，底边44）+8px，靠左对齐；展开时向下生长，不压盖地图
  rr(ctx,x,y,w,h,12); ctx.fillStyle='rgba(255,250,238,0.92)'; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=COL.border; ctx.stroke();
  invSlotsRender=[];
  for(let i=0;i<ids.length;i++){
    const col=i%cols, row=Math.floor(i/cols);
    const sx=x+pad+col*(sw+gap), sy=y+pad+row*(sw+gap);
    rr(ctx,sx,sy,sw,sw,8); ctx.fillStyle='#fff'; ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle=COL.border; ctx.stroke();
    drawItemIcon(ids[i], sx+3, sy+3, sw-6);
    const edible = (ids[i] in EDIBLE);
    invSlotsRender.push({x:sx,y:sy,w:sw,h:sw,id:ids[i], edible, eat:null});
    if(expanded && edible){
      // 右下角"食"小按钮：点击食用恢复体力
      const eb={x:sx+sw-16, y:sy+sw-16, w:16, h:16};
      ctx.fillStyle='#E8913C'; rr(ctx,eb.x,eb.y,eb.w,eb.h,4); ctx.fill();
      setFont(10,true); ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.fillText('食', eb.x+eb.w/2, eb.y+eb.h/2+3); ctx.textAlign='left';
      invSlotsRender[invSlotsRender.length-1].eat=eb;
    }
    if(extra>0 && i===ids.length-1){
      ctx.fillStyle='rgba(120,90,60,0.85)';
      rr(ctx,sx+2,sy+2,16,16,5); ctx.fill();
      setFont(10,true); ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.fillText('+'+extra, sx+10, sy+13);
      ctx.textAlign='left';
    }
  }
  if(expanded && idsAll.length>1){
    setFont(11,false); ctx.fillStyle=COL.sub; ctx.textAlign='center';
    ctx.fillText('点击物品可置顶排序 · 点击【背包】收起', x+w/2, y+h-6);
    ctx.textAlign='left';
  }
}

/* ---------------- 悬浮提示 ---------------- */
function drawTooltip(){
  if(hoverInv){
    const it=ITEMS[hoverInv];
    const base=it?it.name:hoverInv;
    const info = (hoverInv in EDIBLE) ? (base+'（食 +'+EDIBLE[hoverInv]+'体力）') : base;
    setFont(13,true);
    const w=ctx.measureText(info).width+18;
    let x=mouseX+14, y=mouseY+14;
    if(x+w>cw) x=cw-w-4; if(y+28>ch) y=ch-28-4;
    rr(ctx,x,y,w,26,8); ctx.fillStyle='rgba(60,45,25,0.92)'; ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.fillText(info,x+9,y+17);
  }
}

/* ---------------- 时间/夜晚色调 ---------------- */
function drawTimeTint(){
  const h=state.time;
  let a=0;
  if(h<6) a=(6-h)/6*0.35;
  else if(h>19) a=Math.min(0.4,(h-19)/5*0.4);
  if(a>0){ ctx.fillStyle='rgba(20,20,60,'+a+')'; ctx.fillRect(0,0,cw,ch); }
}

/* ---------------- 天气可视化（让天气显示与场景一致） ---------------- */
let weatherT=0;   // 天气动画累计时间
function drawWeatherFX(){
  const w=state.weather;
  if(w==='晴') return;                       // 晴天无特效
  // 整体色调叠加（先铺底色，再画粒子）
  if(w==='大雪'){ ctx.fillStyle='rgba(20,30,50,0.42)'; ctx.fillRect(0,0,cw,ch); }
  else if(w==='霜冻'){ ctx.fillStyle='rgba(200,225,245,0.16)'; ctx.fillRect(0,0,cw,ch); }
  else if(w==='多云'){ ctx.fillStyle='rgba(200,200,205,0.12)'; ctx.fillRect(0,0,cw,ch); }
  else if(w==='小雨'||w==='大雨'||w==='雷阵雨'||w==='台风'){ ctx.fillStyle='rgba(150,175,200,0.14)'; ctx.fillRect(0,0,cw,ch); }
  else if(w==='小雪'){ ctx.fillStyle='rgba(235,240,248,0.12)'; ctx.fillRect(0,0,cw,ch); }

  const W=cw+60;
  const wrap=v=>(v%W+W)%W;

  if(w==='多云'){
    ctx.fillStyle='rgba(245,245,250,0.75)';
    for(let i=0;i<4;i++){
      const cx=wrap(i*280 + weatherT*8) - 100;
      const cy=42+i*26;
      ctx.beginPath(); ctx.ellipse(cx,cy,48,18,0,0,6.28); ctx.ellipse(cx+40,cy+4,34,14,0,0,6.28); ctx.fill();
    }
  } else if(w==='小雨'||w==='大雨'||w==='雷阵雨'||w==='台风'){
    const heavy=(w==='大雨'||w==='台风'||w==='雷阵雨');
    const N= heavy?240:140;
    const sp= heavy?1150:760;
    const spx=(w==='台风')?520:170;
    const sl= heavy?18:14;                    // 雨线长度
    ctx.strokeStyle='rgba(205,222,236,0.55)'; ctx.lineWidth=2;
    for(let i=0;i<N;i++){
      const x=wrap(i*137 + weatherT*spx) - 30;
      const y=wrap(i*89 + weatherT*sp) - 20;
      const dxn=(w==='台风')? -sl*0.8 : -5;    // 台风雨线斜向
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dxn,y+sl); ctx.stroke();
    }
    if(w==='台风'){                            // 横向狂风线
      ctx.strokeStyle='rgba(255,255,255,0.32)'; ctx.lineWidth=2;
      const N2=40, sp2=820;
      for(let i=0;i<N2;i++){
        const x=wrap(i*123 - weatherT*sp2) - 30;
        const y=(i*71)%ch;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+34,y-2); ctx.stroke();
      }
    }
    if(w==='雷阵雨'){                          // 闪电
      const f=(weatherT*0.13)%1;
      if(f<0.06){ const a=(0.06-f)/0.06*0.5; ctx.fillStyle='rgba(255,255,255,'+a+')'; ctx.fillRect(0,0,cw,ch); }
    }
  } else if(w==='霜冻'){                       // 飘浮冰晶
    ctx.fillStyle='rgba(220,240,255,0.7)';
    const N=70, sp=60;
    for(let i=0;i<N;i++){
      const x=wrap(i*151 + Math.sin(weatherT*0.5+i)*20) - 15;
      const y=wrap(i*83 + weatherT*sp) - 15;
      ctx.beginPath(); ctx.arc(x,y,1.6,0,6.28); ctx.fill();
    }
  } else if(w==='小雪'||w==='大雪'){
    const heavy=(w==='大雪');
    const N= heavy?180:90;
    const sp= heavy?150:120;
    const r= heavy?3:2.2;
    ctx.fillStyle='rgba(255,255,255,0.9)';
    for(let i=0;i<N;i++){
      const x=wrap(i*173 + Math.sin(weatherT*0.6+i)*30 + weatherT*40) - 15;
      const y=wrap(i*97 + weatherT*sp) - 15;
      ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.fill();
    }
  }
}

/* ================= 更新 ================= */
function update(dt){
  if(state.sleeping){
    state.sleepTimer-=dt;
    if(state.sleepTimer<=0) finishSleep();
    return;
  }
  // 移动
  let dx=0,dy=0;
  if(keys['arrowleft']||keys['a']) dx-=1;
  if(keys['arrowright']||keys['d']) dx+=1;
  if(keys['arrowup']||keys['w']) dy-=1;
  if(keys['arrowdown']||keys['s']) dy+=1;
  if(dx!==0||dy!==0){
    const len=Math.hypot(dx,dy); dx/=len; dy/=len;
    const sp=170*dt;
    if(dy<0) state.dir='up'; else if(dy>0) state.dir='down'; else if(dx<0) state.dir='left'; else state.dir='right';
    const nx=state.px+dx*sp;
    if(!collides(nx,state.py)) state.px=nx;
    const ny=state.py+dy*sp;
    if(!collides(state.px,ny)) state.py=ny;
  }
  // 遗迹发现：玩家抵达遗迹点位附近即标记已发现（用于世界地图面板灰色模糊→高亮）
  if(map && map.relics){
    const ptx=state.px/TILE, pty=state.py/TILE;
    for(const r of map.relics){
      if(!state.relics[r.id] && Math.hypot(ptx-r.tx, pty-r.ty)<=1.6){ state.relics[r.id]=true; }
    }
  }
  // 时间
  state.time+=dt*TIME_SPEED;
  if(state.time>=24) state.time-=24;
  // 天气动画
  weatherT+=dt;
  // 动物/NPC巡逻
  for(const a of map.animals){
    a.phase+=dt*a.speed;
    a.tx=a.hx+Math.sin(a.phase)*a.range;
    a.ty=a.hy+Math.cos(a.phase*0.8)*a.range*0.6;
  }
  for(const npc of map.npcs){
    if(npc.child){
      // 孩童：被邀请时跟随玩家；否则去当前作息点位（无命中则回默认出生点）
      const h=state.helpers[npc.id];
      let tgt;
      if(h && h.active){ tgt={x:state.px, y:state.py+TILE}; }
      else { const s=childTargetTile(npc); tgt={x:s.tx*TILE, y:s.ty*TILE}; }
      const sp=75*dt;
      let nx=npc.x+clamp(tgt.x-npc.x,-sp,sp);
      let ny=npc.y+clamp(tgt.y-npc.y,-sp,sp);
      if(!collides(nx,npc.y)) npc.x=nx;
      if(!collides(npc.x,ny)) npc.y=ny;
      if(h){
        if(h.cd>0) h.cd=Math.max(0,h.cd-dt);
        if(h.active){
          h.t-=dt;
          if(h.t<=0){ h.active=false; h.cd=CHILD_HELP_COOLDOWN; }
          else {
            h.gatherCd-=dt;
            if(h.gatherCd<=0){
              h.gatherCd=3;   // 每 3 秒采一次，仅拾取地表蘑菇/野花
              let best=null,bd=1e9;
              for(const r of map.resources){
                if(r.depleted) continue;
                if(r.type!=='mushroom' && r.type!=='flower') continue;
                const dd=dist(npc.x,npc.y,r.tx*TILE,r.ty*TILE);
                if(dd<=TILE*1.6 && dd<bd){ bd=dd; best=r; }
              }
              if(best){
                addItem(best.type,1); best.depleted=true; map.occupied.delete(key(best.tx,best.ty));
                const idx=map.resources.indexOf(best); if(idx>=0) map.resources.splice(idx,1);
                toast(npcName(npc.id)+'采到了'+ITEMS[best.type].name);
              }
            }
          }
        }
      }
      continue;
    }
    npc.phase+=dt*npc.speed;
    npc.x=npc.hx+Math.sin(npc.phase)*npc.range*TILE;
    npc.y=npc.hy+Math.cos(npc.phase*0.7)*npc.range*0.5*TILE;
  }
  // 场景任务自动完成（如“跨村送信”：走到村外边缘即触发）
  checkSceneQuests();
  // 全局结局：集齐全部10位NPC至交+支线后，首次解锁“古农田遗迹真相”拼合入口
  if(!state.mainStoryUnlocked && allSecretsComplete()){
    state.mainStoryUnlocked=true; save();
    toast('你集齐了十位村民的碎片……真相，似乎拼成了。');
  }
  // 自动存档（每~5秒）
  saveTimer-=dt; if(saveTimer<=0){ save(); saveTimer=5; }
  if(toastT>0) toastT-=dt;
}
let saveTimer=5;

/* ================= 主循环 ================= */
let last=0;
function loop(ts){
  const dt=Math.min(0.05,(ts-last)/1000)||0; last=ts;
  update(dt);
  updateCamera();
  ctx.clearRect(0,0,cw,ch);
  drawWorld();
  drawTimeTint();
  drawWeatherFX();
  drawTopBar();
  drawInventory();
  drawBottomBar();
  drawMenuButtons();
  if(currentPopup) drawPopup();
  drawTooltip();
  // toast
  if(toastT>0){
    setFont(15,true);
    const tw=ctx.measureText(toastMsg).width+28;
    const x=(cw-tw)/2, y=ch-110;   // 动作栏回到屏幕底部，toast 置于其上方，避免压住动作按钮
    rr(ctx,x,y,tw,34,10); ctx.fillStyle='rgba(60,45,25,0.9)'; ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText(toastMsg,x+tw/2,y+22); ctx.textAlign='left';
  }
  requestAnimationFrame(loop);
}

/* ================= 移动端虚拟控制 ================= */
function isTouchDevice(){
  try{ return (window.navigator && window.navigator.maxTouchPoints>0) || ('ontouchstart' in window) || (cw<760); }
  catch(e){ return cw<760; }
}
function initMobileUI(){
  // 仅浏览器环境且为触摸/小屏设备时创建；无头测试环境（document.createElement 不存在）直接跳过
  if(typeof document==='undefined' || typeof document.createElement!=='function') return;
  if(!isTouchDevice()) return;
  const dpad=document.createElement('div'); dpad.id='dpad';
  const dirMap={dpUp:['w','arrowup'], dpDown:['s','arrowdown'], dpLeft:['a','arrowleft'], dpRight:['d','arrowright']};
  const defs=[['dpUp','▲'],['dpLeft','◀'],['dpA','●'],['dpRight','▶'],['dpDown','▼']];
  for(const id of ['dpUp','dpLeft','dpA','dpRight','dpDown']){
    const txt=defs.find(d=>d[0]===id)[1];
    const b=document.createElement('div'); b.id=id; b.className='dbtn'; b.textContent=txt;
    const dm=dirMap[id];
    if(dm){
      const press=(v)=>{ keys[dm[0]]=v; keys[dm[1]]=v; };
      b.addEventListener('touchstart', e=>{ e.preventDefault(); press(true); }, {passive:false});
      b.addEventListener('touchend',   e=>{ e.preventDefault(); press(false); });
      b.addEventListener('touchcancel',e=>{ press(false); });
    } else {
      b.addEventListener('touchstart', e=>{ e.preventDefault(); tryInteractNPC(); }, {passive:false});
    }
    dpad.appendChild(b);
  }
  document.body.appendChild(dpad);
  dpad.style.display='block';
}

/* ================= 启动 ================= */
function init(){
  resize();
  if(!load()){
    state=defaultState();
    map=buildMap();
    initWeather();
  }
  buildMenuButtons();
  buildBottomButtons();
  initMobileUI();
  requestAnimationFrame(loop);
}
window.addEventListener('resize', ()=>{ buildMenuButtons(); buildBottomButtons(); });
init();
</script>
